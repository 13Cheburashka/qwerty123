          style={{...SI({fontSize:16,padding:'4px 8px',width:70}),textAlign:'center',color:C.rdll,fontWeight:'bold'}}/>
      </div>
      <button onClick={()=>onDelete(mob.id)} style={SB(C.rdl+'55',C.rdl,{fontSize:12,padding:'5px 12px'})}>✕ УДАЛИТЬ</button>
    </div>
    <div style={{display:'flex',borderBottom:'1px solid '+C.brd,background:C.pan,flexShrink:0}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:'transparent',border:'none',borderBottom:tab===t.id?'2px solid '+C.cyl:'2px solid transparent',color:tab===t.id?C.cyl:TX2,fontFamily:C.fn,fontSize:13,letterSpacing:2,padding:'11px 20px',cursor:'pointer'}}>{t.lb}</button>)}
    </div>
    <div style={{flex:1,overflowY:'auto',padding:18}}>
      {tab==='params'&&<>
        <Box color={C.cyl} label="// ПАРАМЕТРЫ ЛЬДА">
          <G2>
            <SF label="Сила Программы" v={mob.strength} onChange={v=>onField(mob,'strength',v)} dis={!isOwn} hint="0 / 1d6+4"/>
            <SF label="Скорость" v={mob.speedStat} onChange={v=>onField(mob,'speedStat',v)} dis={!isOwn} hint="0 / 1d6"/>
            <SF label="Модификатор защиты" v={mob.defenseMod} onChange={v=>onField(mob,'defenseMod',v)} dis={!isOwn} hint="0 / +2"/>
          </G2>
        </Box>
        <div style={{marginTop:16}}>
          <button onClick={()=>onAtk()} style={{...SB(C.rdl,C.rdl,{fontSize:14,padding:'8px 20px',letterSpacing:1})}}>⚔ АТАКА (без программы)</button>
          <div style={{fontSize:12,color:TX2,marginTop:8}}>Глюк / Инициатива / Защита / Бросок — кнопки в шапке этого окна. Атаку конкретной программой можно запустить из вкладки «Программы».</div>
        </div>
      </>}
      {tab==='progs'&&<ProgsTab atkP={progs} defP={[]} utlP={[]} isOwn={isOwn} onAdd={onAdd} onEdit={onEdit} onDel={onDelProg} onCycle={onCycle} onAtk={onAtk} onPing={onPing}/>}
      {tab==='bugs'&&<BugsTab bugs={mob.bugs||defBugs()} isOwn={isOwn} onBug={(id,v)=>onField(mob,'bugs',{...(mob.bugs||defBugs()),[id]:Math.max(0,v)})}/>}
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════
//   MAP CANVAS — points, lines, freehand drawing, fog of war, pointer
// ══════════════════════════════════════════════════════
const MAP_W=2200, MAP_H=1560;
const MAP_LEGEND=[
  {color:'#00cc80',label:'Вход/Выход'},
  {color:'#a06a3a',label:'Твёрдый Лёд'},
  {color:'#00b8d9',label:'Мягкий Лёд'},
  {color:'#ee4455',label:'Красный Лёд'},
  {color:'#cc55ff',label:'Точка доступа'},
  {color:'#ff8833',label:'Хранилище Данных'},
];
const FOG_RADII=[24,45,75,120];

// Small "head in VR goggles" icon — used both for the on-map token and the tray icon
function VRHeadShapes({cx,cy,r,color}){
  return<>
    <circle cx={cx} cy={cy} r={r} fill={color} stroke="#fff" strokeWidth={Math.max(1.5,r*0.14)}/>
    <rect x={cx-r*0.78} y={cy-r*0.32} width={r*1.56} height={r*0.58} rx={r*0.26} fill="#10151c"/>
    <rect x={cx-r*0.62} y={cy-r*0.2} width={r*0.52} height={r*0.34} rx={r*0.15} fill="#8fe0ff" opacity="0.92"/>
    <rect x={cx+r*0.1} y={cy-r*0.2} width={r*0.52} height={r*0.34} rx={r*0.15} fill="#8fe0ff" opacity="0.92"/>
    <rect x={cx-r*0.09} y={cy-r*0.1} width={r*0.18} height={r*0.16} fill="#10151c"/>
  </>;
}

function MapCanvas({mapState,onChange,isGM,myId,myColor,myName,roster}){
  const [tool,setTool]=useState('select');
  const [color,setColor]=useState(MAP_LEGEND[0].color);
  const [fogR,setFogR]=useState(FOG_RADII[1]);
  const [pendingConnect,setPendingConnect]=useState(null);
  const [showLegend,setShowLegend]=useState(true);
  const [live,setLive]=useState(null); // {kind:'dragGroup'|'brush'|'drawLine'|'fog'|'pointer', ...}
  const [vb,setVb]=useState({x:0,y:0,w:MAP_W,h:MAP_H}); // pan/zoom viewport, in map coords
  const [panning,setPanning]=useState(null);
  const [selPoints,setSelPoints]=useState([]);
  const [selLines,setSelLines]=useState([]);
  const [selStrokes,setSelStrokes]=useState([]);
  const [marquee,setMarquee]=useState(null); // {x0,y0,x1,y1}
  const [pointers,setPointers]=useState({}); // live laser-pointer arrows from everyone, keyed by userId
  const svgRef=useRef(null);
  const mapId=mapState.id;

  const clearSel=()=>{setSelPoints([]);setSelLines([]);setSelStrokes([]);};
  const selCount=selPoints.length+selLines.length+selStrokes.length;

  const points=(live&&live.kind==='dragGroup')?live.points:(mapState.points||[]);
  const lines=mapState.lines||[];
  const strokes=(live&&live.kind==='dragGroup')?live.strokes:(live&&(live.kind==='brush'||live.kind==='drawLine'))?[...(mapState.strokes||[]),live.stroke]:(mapState.strokes||[]);
  const fog=mapState.fog||{baseRevealed:false,strokes:[]};
  const fogStrokes=(live&&live.kind==='fog')?[...(fog.strokes||[]),live.stroke]:(fog.strokes||[]);

  const avatars={...(mapState.avatars||{})};
  if(live&&live.kind==='avatar')avatars[live.playerId]={x:live.x,y:live.y};
  const canMoveAvatar=playerId=>isGM||playerId===myId;

  // live pointer/laser arrows: everyone's, merged with our own in-progress one for instant local feedback
  const livePointers={...pointers};
  if(live&&live.kind==='pointer')livePointers[myId]={x0:live.x0,y0:live.y0,x1:live.x1,y1:live.y1,color:myColor,name:myName};
  else delete livePointers[myId];

  useEffect(()=>{
    if(!mapId)return;
    const unsub=DB.sub('cp20/pointers/'+mapId,val=>setPointers(val||{}));
    return unsub;
  },[mapId]);

  const getRel=e=>{
    const rect=svgRef.current.getBoundingClientRect();
    const svgAspect=vb.w/vb.h, boxAspect=rect.width/rect.height;
    let renderedW,renderedH,offX,offY;
    if(boxAspect>svgAspect){renderedH=rect.height;renderedW=renderedH*svgAspect;offX=(rect.width-renderedW)/2;offY=0;}
    else{renderedW=rect.width;renderedH=renderedW/svgAspect;offX=0;offY=(rect.height-renderedH)/2;}
    return{relX:(e.clientX-rect.left-offX)/renderedW,relY:(e.clientY-rect.top-offY)/renderedH};
  };
  const toCoords=e=>{
    const{relX,relY}=getRel(e);
    const x=vb.x+relX*vb.w, y=vb.y+relY*vb.h;
    return{x:Math.max(0,Math.min(MAP_W,x)),y:Math.max(0,Math.min(MAP_H,y))};
  };
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

  // Delete/Backspace removes all selected points/lines/strokes — ignored while typing elsewhere.
  useEffect(()=>{
    const onKey=e=>{
      if(e.key!=='Delete'&&e.key!=='Backspace')return;
      const tag=document.activeElement&&document.activeElement.tagName;
      if(tag==='INPUT'||tag==='TEXTAREA')return;
      if(!selPoints.length&&!selLines.length&&!selStrokes.length)return;
      e.preventDefault();
      onChange({...mapState,
        points:(mapState.points||[]).filter(p=>!selPoints.includes(p.id)),
        lines:(mapState.lines||[]).filter(l=>!selLines.includes(l.id)&&!selPoints.includes(l.aId)&&!selPoints.includes(l.bId)),
        strokes:(mapState.strokes||[]).filter(s=>!selStrokes.includes(s.id))});
      clearSel();
    };
    document.addEventListener('keydown',onKey);
    return()=>document.removeEventListener('keydown',onKey);
  },[selPoints,selLines,selStrokes,mapState]);

  const onWheel=e=>{
    e.preventDefault();
    const{relX,relY}=getRel(e);
    const cx=vb.x+relX*vb.w, cy=vb.y+relY*vb.h;
    const factor=e.deltaY>0?1.14:1/1.14;
    const nw=Math.max(MAP_W*0.06,Math.min(MAP_W*1.5,vb.w*factor));
    const nh=nw*(MAP_H/MAP_W);
    setVb({x:cx-relX*nw,y:cy-relY*nh,w:nw,h:nh});
  };

  const addPoint=(x,y)=>onChange({...mapState,points:[...(mapState.points||[]),{id:uid(),x,y,color}]});
  const addConnector=(aId,bId)=>{if(aId!==bId)onChange({...mapState,lines:[...lines,{id:uid(),aId,bId,color}]});};
  const deletePoint=id=>onChange({...mapState,points:(mapState.points||[]).filter(p=>p.id!==id),lines:lines.filter(l=>l.aId!==id&&l.bId!==id)});
  const deleteLine=id=>onChange({...mapState,lines:lines.filter(l=>l.id!==id)});
  const deleteStroke=id=>onChange({...mapState,strokes:(mapState.strokes||[]).filter(s=>s.id!==id)});

  const revealAll=()=>onChange({...mapState,fog:{baseRevealed:true,strokes:[]}});
  const hideAll=()=>onChange({...mapState,fog:{baseRevealed:false,strokes:[]}});
  const clearMap=()=>{if(window.confirm('Очистить все точки, линии и рисунки на карте?'))onChange({...mapState,points:[],lines:[],strokes:[]});};
  const resetView=()=>setVb({x:0,y:0,w:MAP_W,h:MAP_H});

  const startGroupDrag=(e,pointIds,strokeIds)=>{
    const startMouse=toCoords(e);
    const startPointPositions=Object.fromEntries((mapState.points||[]).filter(p=>pointIds.includes(p.id)).map(p=>[p.id,{x:p.x,y:p.y}]));
    const startStrokePts=Object.fromEntries((mapState.strokes||[]).filter(s=>strokeIds.includes(s.id)).map(s=>[s.id,s.pts.map(pt=>({...pt}))]));
    setLive({kind:'dragGroup',startMouse,pointIds,strokeIds,startPointPositions,startStrokePts,points:mapState.points||[],strokes:mapState.strokes||[]});
  };
  const startAvatarDrag=(e,playerId)=>{
    if(!canMoveAvatar(playerId))return;
    e.stopPropagation();
    const {x,y}=toCoords(e);
    setLive({kind:'avatar',playerId,x,y});
  };

  const onPointDown=(e,p)=>{
    e.stopPropagation();
    if(tool==='erase'){deletePoint(p.id);return;}
    if(tool==='connect'){
      if(pendingConnect){addConnector(pendingConnect,p.id);setPendingConnect(null);}else setPendingConnect(p.id);
      return;
    }
    if(tool==='select'){
      if(e.shiftKey){setSelPoints(sel=>sel.includes(p.id)?sel.filter(id=>id!==p.id):[...sel,p.id]);return;}
      const already=selPoints.includes(p.id);
      const pointIds=already?selPoints:[p.id];
      const strokeIds=already?selStrokes:[];
      if(!already){setSelPoints([p.id]);setSelLines([]);setSelStrokes([]);}
      startGroupDrag(e,pointIds,strokeIds);
    }
  };
  const onLineDown=(e,l)=>{
    if(tool==='erase'){e.stopPropagation();deleteLine(l.id);return;}
    if(tool==='select'){
      e.stopPropagation();
      if(e.shiftKey){setSelLines(sel=>sel.includes(l.id)?sel.filter(id=>id!==l.id):[...sel,l.id]);return;}
      setSelPoints([]);setSelStrokes([]);setSelLines([l.id]);
    }
  };
  const onStrokeDown=(e,s)=>{
    if(tool==='erase'){e.stopPropagation();deleteStroke(s.id);return;}
    if(tool==='select'){
      e.stopPropagation();
      if(e.shiftKey){setSelStrokes(sel=>sel.includes(s.id)?sel.filter(id=>id!==s.id):[...sel,s.id]);return;}
      const already=selStrokes.includes(s.id);
      const strokeIds=already?selStrokes:[s.id];
      const pointIds=already?selPoints:[];
      if(!already){setSelPoints([]);setSelLines([]);setSelStrokes([s.id]);}
      startGroupDrag(e,pointIds,strokeIds);
    }
  };

  const onSvgClick=e=>{
    if(tool==='point'){const{x,y}=toCoords(e);addPoint(x,y);}
  };
  const onSvgMouseDown=e=>{
    if(e.button===2){
      e.preventDefault();
      setPanning({startX:e.clientX,startY:e.clientY,startVb:vb});
      return;
    }
    const{x,y}=toCoords(e);
    if(tool==='pointer'){
      setLive({kind:'pointer',x0:x,y0:y,x1:x,y1:y,lastSent:{x,y}});
      if(mapId)DB.set('cp20/pointers/'+mapId+'/'+myId,{x0:x,y0:y,x1:x,y1:y,color:myColor,name:myName});
      return;
    }
    if(tool==='select'){setMarquee({x0:x,y0:y,x1:x,y1:y});return;}
    if(tool==='brush'){setLive({kind:'brush',stroke:{id:uid(),kind:'brush',pts:[{x,y}],color,width:5}});}
    else if(tool==='drawLine'){setLive({kind:'drawLine',stroke:{id:uid(),kind:'line',pts:[{x,y},{x,y}],color,width:5}});}
    else if((tool==='fogHide'||tool==='fogReveal')&&isGM){setLive({kind:'fog',stroke:{id:uid(),kind:tool==='fogHide'?'hide':'reveal',pts:[{x,y}],r:fogR}});}
  };
  const onSvgMouseMove=e=>{
    if(panning){
      const rect=svgRef.current.getBoundingClientRect();
      const svgAspect=panning.startVb.w/panning.startVb.h, boxAspect=rect.width/rect.height;
      const renderedW=boxAspect>svgAspect?rect.height*svgAspect:rect.width;
      const renderedH=boxAspect>svgAspect?rect.height:rect.width/svgAspect;
      const dx=(e.clientX-panning.startX)/renderedW*panning.startVb.w;
      const dy=(e.clientY-panning.startY)/renderedH*panning.startVb.h;
      setVb({...panning.startVb,x:panning.startVb.x-dx,y:panning.startVb.y-dy});
      return;
    }
    if(marquee){const cur=toCoords(e);setMarquee({...marquee,x1:cur.x,y1:cur.y});return;}
    if(!live)return;
    const{x,y}=toCoords(e);
    if(live.kind==='dragGroup'){
      const dx=x-live.startMouse.x,dy=y-live.startMouse.y;
      const newPoints=live.points.map(p=>live.pointIds.includes(p.id)?{...p,x:live.startPointPositions[p.id].x+dx,y:live.startPointPositions[p.id].y+dy}:p);
      const newStrokes=live.strokes.map(s=>live.strokeIds.includes(s.id)?{...s,pts:live.startStrokePts[s.id].map(pt=>({x:pt.x+dx,y:pt.y+dy}))}:s);
      setLive({...live,points:newPoints,strokes:newStrokes});
    }
    else if(live.kind==='brush'){
      const pts=live.stroke.pts;
      if(dist(pts[pts.length-1],{x,y})>5)setLive({...live,stroke:{...live.stroke,pts:[...pts,{x,y}]}});
    }
    else if(live.kind==='drawLine'){setLive({...live,stroke:{...live.stroke,pts:[live.stroke.pts[0],{x,y}]}});}
    else if(live.kind==='fog'){
      const pts=live.stroke.pts;
      if(dist(pts[pts.length-1],{x,y})>Math.max(6,fogR*0.25))setLive({...live,stroke:{...live.stroke,pts:[...pts,{x,y}]}});
    }
    else if(live.kind==='pointer'){
      const next={...live,x1:x,y1:y};
      if(dist(live.lastSent,{x,y})>10){
        next.lastSent={x,y};
        if(mapId)DB.set('cp20/pointers/'+mapId+'/'+myId,{x0:live.x0,y0:live.y0,x1:x,y1:y,color:myColor,name:myName});
      }
      setLive(next);
    }
    else if(live.kind==='avatar'){setLive({...live,x,y});}
  };
  const onSvgMouseUp=e=>{
    if(panning){setPanning(null);return;}
    if(marquee){
      const x0=Math.min(marquee.x0,marquee.x1),x1=Math.max(marquee.x0,marquee.x1);
      const y0=Math.min(marquee.y0,marquee.y1),y1=Math.max(marquee.y0,marquee.y1);
      const inRect=(px,py)=>px>=x0&&px<=x1&&py>=y0&&py<=y1;
      const pIds=(mapState.points||[]).filter(p=>inRect(p.x,p.y)).map(p=>p.id);
      const sIds=(mapState.strokes||[]).filter(s=>s.pts.some(pt=>inRect(pt.x,pt.y))).map(s=>s.id);
      const lIds=(mapState.lines||[]).filter(l=>{
        const a=(mapState.points||[]).find(p=>p.id===l.aId),b=(mapState.points||[]).find(p=>p.id===l.bId);
        return a&&b&&(inRect(a.x,a.y)||inRect(b.x,b.y));
      }).map(l=>l.id);
      setSelPoints(pIds);setSelStrokes(sIds);setSelLines(lIds);
      setMarquee(null);
      return;
    }
    if(!live){return;}
    if(live.kind==='dragGroup')onChange({...mapState,points:live.points,strokes:live.strokes});
    else if(live.kind==='brush'||live.kind==='drawLine')onChange({...mapState,strokes:[...(mapState.strokes||[]),live.stroke]});
    else if(live.kind==='fog')onChange({...mapState,fog:{...fog,strokes:[...(fog.strokes||[]),live.stroke]}});
    else if(live.kind==='pointer'){if(mapId)DB.remove('cp20/pointers/'+mapId+'/'+myId);}
    else if(live.kind==='avatar'){
      let x=live.x,y=live.y;
      if(e&&svgRef.current){const c=toCoords(e);x=c.x;y=c.y;}
      onChange({...mapState,avatars:{...(mapState.avatars||{}),[live.playerId]:{x,y}}});
    }
    setLive(null);
  };

  // Drag/draw tracking on document level, so passing over the toolbar never interrupts a stroke/pan/marquee.
  const moveRef=useRef(onSvgMouseMove), upRef=useRef(onSvgMouseUp);
  moveRef.current=onSvgMouseMove; upRef.current=onSvgMouseUp;
  const isDragging=!!live||!!panning||!!marquee;
  useEffect(()=>{
    if(!isDragging)return;
    const onMove=e=>moveRef.current(e);
    const onUp=e=>upRef.current(e);
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
  },[isDragging]);

  const TOOLS=[['select','🖐','Выбор'],['point','⬤','Точка'],['connect','🔗','Соединить'],
    ['drawLine','📏','Линия'],['brush','✏️','Кисть'],['pointer','👉','Указка'],['erase','🗑','Удалить']];

  return<div style={{flex:1,position:'relative',overflow:'hidden',background:'#060c14',minWidth:0}}>
    <div style={{position:'absolute',top:10,left:10,zIndex:20,background:C.pan,border:'1px solid '+C.brd,borderRadius:5,padding:9,
      display:'flex',flexDirection:'column',gap:5,width:150,maxHeight:'88%',overflowY:'auto',boxShadow:'0 4px 18px rgba(0,0,0,0.5)'}}>
      {TOOLS.map(([id,ic,label])=><button key={id} title={label} onClick={()=>{setTool(id);setPendingConnect(null);clearSel();}}
        style={{...SB(tool===id?C.aml:C.brd,tool===id?C.aml:TX2,{padding:'6px 9px',fontSize:14,display:'flex',alignItems:'center',gap:8,textAlign:'left'})}}>
        <span>{ic}</span><span style={{fontSize:12}}>{label}</span>
      </button>)}
      {isGM&&<>
        <div style={{height:1,background:C.brd,margin:'3px 0'}}/>
        <button title="Круглый ластик: рассеять туман" onClick={()=>{setTool('fogReveal');setPendingConnect(null);clearSel();}}
          style={{...SB(tool==='fogReveal'?C.gnl:C.brd,tool==='fogReveal'?C.gnl:TX2,{padding:'6px 9px',fontSize:12,textAlign:'left'})}}>☀ Рассеять</button>
        <button title="Круглая кисть: вернуть туман" onClick={()=>{setTool('fogHide');setPendingConnect(null);clearSel();}}
          style={{...SB(tool==='fogHide'?C.prp:C.brd,tool==='fogHide'?C.prp:TX2,{padding:'6px 9px',fontSize:12,textAlign:'left'})}}>🌫 Скрыть</button>
      </>}
      {(tool==='fogHide'||tool==='fogReveal')&&isGM&&<div style={{display:'flex',flexWrap:'wrap',gap:4,alignItems:'center'}}>
        <span style={{fontSize:10,color:TX2,width:'100%'}}>Размер:</span>
        {FOG_RADII.map(r=><button key={r} onClick={()=>setFogR(r)} style={{...SB(fogR===r?C.aml:C.brd,fogR===r?C.aml:TX2,{padding:'3px 8px',fontSize:10})}}>{r}</button>)}
      </div>}
      <div style={{height:1,background:C.brd,margin:'3px 0'}}/>
      <div style={{fontSize:10,color:TX2,letterSpacing:1}}>ЦВЕТ</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
        {MAP_LEGEND.map(l=><div key={l.color} onClick={()=>setColor(l.color)} title={l.label}
          style={{width:18,height:18,borderRadius:'50%',background:l.color,cursor:'pointer',outline:color===l.color?'2px solid #fff':'1px solid #0006',outlineOffset:1,flexShrink:0}}/>)}
        <input type="color" value={color} onChange={e=>setColor(e.target.value)} title="Полная палитра"
          style={{width:22,height:20,padding:0,border:'1px solid '+C.brdl,borderRadius:3,background:'transparent',cursor:'pointer'}}/>
      </div>
      <div style={{height:1,background:C.brd,margin:'3px 0'}}/>
      {isGM&&<>
        <button title="Открыть весь туман" onClick={revealAll} style={SB(C.brd,TX2,{padding:'6px 9px',fontSize:11,textAlign:'left'})}>Туман: всё видно</button>
        <button title="Скрыть весь туман" onClick={hideAll} style={SB(C.brd,TX2,{padding:'6px 9px',fontSize:11,textAlign:'left'})}>Туман: всё скрыто</button>
        <button title="Очистить карту" onClick={clearMap} style={SB(C.rdl+'66',C.rdl,{padding:'6px 9px',fontSize:11,textAlign:'left'})}>🗑 Карта</button>
        <div style={{height:1,background:C.brd,margin:'3px 0'}}/>
      </>}
      <button title="Сбросить масштаб" onClick={resetView} style={SB(C.brd,TX2,{padding:'6px 9px',fontSize:11,textAlign:'left'})}>🔍 Сброс вида</button>
      <span style={{fontSize:9,color:TX2,lineHeight:1.5}}>колесо — зум<br/>ПКМ — перемещение</span>
    </div>

    <div style={{position:'absolute',top:10,right:10,zIndex:20,background:C.pan,border:'1px solid '+C.brd,borderRadius:5,padding:8,
      display:'flex',flexDirection:'column',gap:6,boxShadow:'0 4px 18px rgba(0,0,0,0.5)',maxWidth:150}}>
      <div style={{fontSize:10,color:C.aml,letterSpacing:1}}>АВАТАРЫ</div>
      {(roster||[]).map(pl=>{
        const movable=canMoveAvatar(pl.id);
        const placed=!!avatars[pl.id];
        return<div key={pl.id} title={movable?(placed?'Перетащите, чтобы переместить':'Перетащите на карту'):'Доступно только владельцу или ГМ'}
          onMouseDown={e=>movable&&startAvatarDrag(e,pl.id)}
          style={{display:'flex',alignItems:'center',gap:7,cursor:movable?'grab':'default',opacity:movable?1:0.45}}>
          <svg width={24} height={24} viewBox="0 0 24 24" style={{flexShrink:0}}><VRHeadShapes cx={12} cy={12} r={10} color={pl.color}/></svg>
          <span style={{fontSize:11,color:C.txb,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{pl.handle}{placed?' ✓':''}</span>
        </div>;
      })}
    </div>

    <svg ref={svgRef} viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`} preserveAspectRatio="xMidYMid meet"
      style={{width:'100%',height:'100%',display:'block',cursor:panning?'grabbing':tool==='select'?'default':(tool==='fogHide'||tool==='fogReveal')?'cell':'crosshair'}}
      onClick={onSvgClick} onMouseDown={onSvgMouseDown}
      onWheel={onWheel} onContextMenu={e=>e.preventDefault()}>
      <defs>
        <mask id="fogMask" maskUnits="userSpaceOnUse" x="0" y="0" width={MAP_W} height={MAP_H}>
          <rect x={0} y={0} width={MAP_W} height={MAP_H} fill={fog.baseRevealed?'black':'white'}/>
          {fogStrokes.map(s=><g key={s.id}>
            {s.pts.map((pt,i)=><circle key={i} cx={pt.x} cy={pt.y} r={s.r} fill={s.kind==='reveal'?'black':'white'}/>)}
          </g>)}
        </mask>
      </defs>
      <rect x={0} y={0} width={MAP_W} height={MAP_H} fill="#26405c"/>
      {lines.map(l=>{
        if(!selLines.includes(l.id))return null;
        const a=points.find(p=>p.id===l.aId),b=points.find(p=>p.id===l.bId);
        if(!a||!b)return null;
        return<line key={'selL'+l.id} x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="#00e5ff" strokeWidth={12} strokeLinecap="round" opacity={0.5}/>;
      })}
      {strokes.map(s=>selStrokes.includes(s.id)&&(s.kind==='line'
        ?<line key={'selS'+s.id} x1={s.pts[0].x} y1={s.pts[0].y} x2={s.pts[1].x} y2={s.pts[1].y} stroke="#00e5ff" strokeWidth={s.width+9} strokeLinecap="round" opacity={0.5}/>
        :<polyline key={'selS'+s.id} points={s.pts.map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke="#00e5ff" strokeWidth={s.width+9} strokeLinecap="round" strokeLinejoin="round" opacity={0.5}/>
      ))}
      {lines.map(l=>{
        const a=points.find(p=>p.id===l.aId),b=points.find(p=>p.id===l.bId);
        if(!a||!b)return null;
        return<line key={l.id} x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={l.color} strokeWidth={4} strokeLinecap="round"
          onMouseDown={e=>onLineDown(e,l)}
          style={{cursor:tool==='erase'||tool==='select'?'pointer':'default'}}/>;
      })}
      {strokes.map(s=>s.kind==='line'
        ?<line key={s.id} x1={s.pts[0].x} y1={s.pts[0].y} x2={s.pts[1].x} y2={s.pts[1].y} stroke={s.color} strokeWidth={s.width} strokeLinecap="round"
            onMouseDown={e=>onStrokeDown(e,s)} style={{cursor:tool==='erase'||tool==='select'?'pointer':'default'}}/>
        :<polyline key={s.id} points={s.pts.map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke={s.color} strokeWidth={s.width} strokeLinecap="round" strokeLinejoin="round"
            onMouseDown={e=>onStrokeDown(e,s)} style={{cursor:tool==='erase'||tool==='select'?'pointer':'default'}}/>
      )}
      {points.map(p=>selPoints.includes(p.id)&&<circle key={'sel'+p.id} cx={p.x} cy={p.y} r={16} fill="none" stroke="#00e5ff" strokeWidth={2.5} strokeDasharray="4,3"/>)}
      {points.map(p=><circle key={p.id} cx={p.x} cy={p.y} r={p.id===pendingConnect?13:10} fill={p.color}
        stroke={p.id===pendingConnect?'#fff':'#000'} strokeWidth={p.id===pendingConnect?4:2.5}
        onMouseDown={e=>onPointDown(e,p)} style={{cursor:tool==='select'?'grab':'pointer'}}/>)}
      {marquee&&<rect x={Math.min(marquee.x0,marquee.x1)} y={Math.min(marquee.y0,marquee.y1)}
        width={Math.abs(marquee.x1-marquee.x0)} height={Math.abs(marquee.y1-marquee.y0)}
        fill="rgba(0,184,217,0.15)" stroke="#00b8d9" strokeWidth={1.5} strokeDasharray="6,4"/>}
      <rect x={0} y={0} width={MAP_W} height={MAP_H} fill="#000" opacity={isGM?0.55:1} mask="url(#fogMask)" style={{pointerEvents:'none'}}/>
      {Object.entries(livePointers).map(([uid_,p])=>{
        const angle=Math.atan2(p.y1-p.y0,p.x1-p.x0);
        const headLen=30;
        const p1={x:p.x1-headLen*Math.cos(angle-Math.PI/7),y:p.y1-headLen*Math.sin(angle-Math.PI/7)};
        const p2={x:p.x1-headLen*Math.cos(angle+Math.PI/7),y:p.y1-headLen*Math.sin(angle+Math.PI/7)};
        return<g key={uid_} style={{pointerEvents:'none'}}>
          <line x1={p.x0} y1={p.y0} x2={p.x1} y2={p.y1} stroke={p.color} strokeWidth={6} strokeLinecap="round" opacity={0.92}/>
          <polygon points={`${p.x1},${p.y1} ${p1.x},${p1.y} ${p2.x},${p2.y}`} fill={p.color}/>
          <text x={p.x1+16} y={p.y1-10} fontSize={22} fontFamily={C.fn} fill={p.color} stroke="#000" strokeWidth={3} paintOrder="stroke" fontWeight="bold">{p.name}</text>
        </g>;
      })}
      {(roster||[]).filter(pl=>avatars[pl.id]).map(pl=>{
        const pos=avatars[pl.id];
        const movable=canMoveAvatar(pl.id);
        return<g key={'av'+pl.id} onMouseDown={e=>startAvatarDrag(e,pl.id)} style={{cursor:movable?'grab':'default'}}>
          <VRHeadShapes cx={pos.x} cy={pos.y} r={22} color={pl.color}/>
          <text x={pos.x} y={pos.y+40} fontSize={15} fontFamily={C.fn} fill={pl.color} stroke="#000" strokeWidth={2.5} paintOrder="stroke" textAnchor="middle" fontWeight="bold">{pl.handle}</text>
        </g>;
      })}
    </svg>

    {tool==='connect'&&pendingConnect&&<div style={{position:'absolute',bottom:10,left:10,fontSize:12,color:C.aml,background:C.pan,padding:'6px 12px',border:'1px solid '+C.brd,borderRadius:4}}>Выберите вторую точку для соединения…</div>}
    {tool==='select'&&selCount>0&&<div style={{position:'absolute',bottom:10,left:10,fontSize:12,color:C.cyl,background:C.pan,padding:'6px 12px',border:'1px solid '+C.brd,borderRadius:4,display:'flex',alignItems:'center',gap:10}}>
      <span>Выбрано: {selCount}. Тяните — переместить, Delete — удалить.</span>
      <button onClick={()=>{onChange({...mapState,
          points:(mapState.points||[]).filter(p=>!selPoints.includes(p.id)),
          lines:(mapState.lines||[]).filter(l=>!selLines.includes(l.id)&&!selPoints.includes(l.aId)&&!selPoints.includes(l.bId)),
          strokes:(mapState.strokes||[]).filter(s=>!selStrokes.includes(s.id))});clearSel();}}
        style={SB(C.rdl+'88',C.rdl,{padding:'3px 10px',fontSize:11})}>🗑 Удалить</button>
    </div>}

    <div style={{position:'absolute',bottom:10,right:10,zIndex:20,background:C.pan,border:'1px solid '+C.brd,borderRadius:5,boxShadow:'0 4px 18px rgba(0,0,0,0.5)',maxWidth:220}}>
      <div onClick={()=>setShowLegend(v=>!v)} style={{padding:'7px 12px',fontSize:11,color:C.aml,letterSpacing:2,cursor:'pointer',userSelect:'none',display:'flex',justifyContent:'space-between',borderBottom:showLegend?'1px solid '+C.brd:'none'}}>
        <span>ЛЕГЕНДА</span><span>{showLegend?'▾':'▸'}</span>
      </div>
      {showLegend&&<div style={{padding:'8px 12px'}}>
        {MAP_LEGEND.map(l=><div key={l.color} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
          <div style={{width:12,height:12,borderRadius:'50%',background:l.color,flexShrink:0,boxShadow:'0 0 5px '+l.color+'aa'}}/>
          <span style={{fontSize:12,color:C.txb}}>{l.label}</span>
        </div>)}
      </div>}
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════
//   FLOATING WINDOW (draggable + resizable, Foundry-style)
// ══════════════════════════════════════════════════════
function FloatingWindow({win,title,color,onClose,onFocus,onMove,onResize,children}){
  const onHeaderDown=e=>{
    if(e.target.closest('button'))return;
    onFocus();
    const startX=e.clientX,startY=e.clientY,ox=win.x,oy=win.y;
    const onMove_=ev=>onMove(win.id,ox+(ev.clientX-startX),oy+(ev.clientY-startY));
    const onUp=()=>{document.removeEventListener('mousemove',onMove_);document.removeEventListener('mouseup',onUp);};
    document.addEventListener('mousemove',onMove_);document.addEventListener('mouseup',onUp);
  };
  const onResizeDown=e=>{
    e.stopPropagation();onFocus();
    const startX=e.clientX,startY=e.clientY,ow=win.w,oh=win.h;
    const onMove_=ev=>onResize(win.id,Math.max(380,ow+(ev.clientX-startX)),Math.max(320,oh+(ev.clientY-startY)));
    const onUp=()=>{document.removeEventListener('mousemove',onMove_);document.removeEventListener('mouseup',onUp);};
    document.addEventListener('mousemove',onMove_);document.addEventListener('mouseup',onUp);
  };
  return<div onMouseDown={onFocus} style={{position:'absolute',left:win.x,top:win.y,width:win.w,height:win.h,zIndex:win.z,
      background:C.bg,border:'1px solid '+(color||C.brdl),boxShadow:'0 14px 44px rgba(0,0,0,0.65)',display:'flex',flexDirection:'column',borderRadius:5,overflow:'hidden'}}>
    <div onMouseDown={onHeaderDown} style={{background:C.pan,borderBottom:'1px solid '+C.brd,padding:'8px 10px',display:'flex',alignItems:'center',gap:8,cursor:'move',flexShrink:0,userSelect:'none'}}>
      <div style={{width:9,height:9,borderRadius:'50%',background:color||C.aml,flexShrink:0,boxShadow:'0 0 6px '+(color||C.aml)}}/>
      <span style={{fontFamily:C.or,fontSize:13,color:C.txb,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',letterSpacing:1}}>{title}</span>
      <button onClick={onClose} style={{background:'transparent',border:'none',color:TX2,cursor:'pointer',fontSize:18,lineHeight:1,padding:'0 2px'}}>✕</button>
    </div>
    <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',minHeight:0}}>{children}</div>
    <div onMouseDown={onResizeDown} style={{position:'absolute',right:2,bottom:2,width:16,height:16,cursor:'nwse-resize',opacity:0.6}}>
      <svg width="16" height="16"><path d="M14 2 L2 14 M14 8 L8 14" stroke={C.brdl} strokeWidth="1.5"/></svg>
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════
//   CHARACTER PICKER (popover from top bar)
// ══════════════════════════════════════════════════════
function CharPicker({roster,mobRoster,myId,isGM,onOpen,onClose,onCreateMob}){
  const [open,setOpen]=useState({players:true,blackice:true,demon:true});
  const toggle=k=>setOpen(o=>({...o,[k]:!o[k]}));
  const biList=mobRoster.filter(m=>m.mobType==='blackice');
  const dmList=mobRoster.filter(m=>m.mobType==='demon');

  const Row=({color,name,tag,onClick})=>(
    <button onClick={onClick} style={{width:'100%',background:'transparent',border:'none',color:C.txb,fontFamily:C.fn,fontSize:14,
      padding:'8px 12px 8px 22px',cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:8}}>
      <div style={{width:7,height:7,borderRadius:'50%',background:color,flexShrink:0}}/>
      <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{name}</span>
      {tag&&<span style={{fontSize:10,color:TX2,flexShrink:0}}>{tag}</span>}
    </button>
  );
  const create=async(type)=>{
    const id=await onCreateMob(type);
    onOpen({type,id});
    onClose();
  };
  const Folder=({fk,label,color,list,type,canCreate})=><div>
    <div onClick={()=>toggle(fk)} style={{padding:'8px 12px',fontSize:12,color,letterSpacing:2,background:C.pan2,borderBottom:'1px solid '+C.brd,display:'flex',justifyContent:'space-between',cursor:'pointer',userSelect:'none'}}>
      <span>{open[fk]?'▾':'▸'} {label}</span><span>{list.length}</span>
    </div>
    {open[fk]&&<>
      {list.map(x=><Row key={x.id} color={x.color} name={x.handle} onClick={()=>{onOpen({type,id:x.id});onClose();}}/>)}
      {canCreate&&<div style={{padding:'6px 10px'}}>
        <button onClick={()=>create(type)} style={{...SB(color,color,{width:'100%',padding:'6px',fontSize:12,letterSpacing:1})}}>+ Добавить</button>
      </div>}
    </>}
  </div>;

  return<div style={{position:'fixed',inset:0,zIndex:60}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:52,left:10,width:260,background:C.pan,border:'1px solid '+C.brd,borderRadius:5,
      boxShadow:'0 12px 40px rgba(0,0,0,0.6)',maxHeight:'70vh',overflowY:'auto'}}>
      <div style={{padding:'10px 12px',borderBottom:'1px solid '+C.brd,fontSize:12,color:C.prp,letterSpacing:2,fontWeight:'bold'}}>ПЕРСОНАЖИ</div>
      {!isGM&&roster.filter(p=>p.id===myId).map(p=><Row key={p.id} color={p.color} name={p.handle} tag="вы" onClick={()=>{onOpen({type:'player',id:p.id});onClose();}}/>)}
      {isGM&&<>
        <Folder fk="players" type="player" label="👤 ИГРОКИ" color={C.aml} list={roster} canCreate={false}/>
        <Folder fk="blackice" type="blackice" label="❄ ЧЁРНЫЙ ЛЁД" color={C.cyl} list={biList} canCreate={true}/>
        <Folder fk="demon" type="demon" label="👹 ДЕМОНЫ/РАНЕРЫ" color={C.prp} list={dmList} canCreate={true}/>
      </>}
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════
//   MAPS PANEL (GM only)
// ══════════════════════════════════════════════════════
function MapsPanel({maps,activeMapId,viewMapId,onSelect,onActivate,onCreate,onRename,onDelete,onClose}){
  const [editingId,setEditingId]=useState(null);
  const [editName,setEditName]=useState('');
  const startEdit=m=>{setEditingId(m.id);setEditName(m.name);};
  const commitEdit=()=>{if(editName.trim())onRename(editingId,editName.trim());setEditingId(null);};

  return<div style={{position:'fixed',inset:0,zIndex:60}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:52,left:10,width:300,background:C.pan,border:'1px solid '+C.brd,borderRadius:5,
      boxShadow:'0 12px 40px rgba(0,0,0,0.6)',maxHeight:'75vh',overflowY:'auto'}}>
      <div style={{padding:'10px 12px',borderBottom:'1px solid '+C.brd,fontSize:12,color:C.cyl,letterSpacing:2,fontWeight:'bold',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>🗺 КАРТЫ</span>
        <button onClick={onCreate} style={SB(C.cyl,C.cyl,{padding:'4px 10px',fontSize:11})}>+ Новая</button>
      </div>
      {maps.map(m=>{
        const isActive=m.id===activeMapId, isViewing=m.id===viewMapId;
        return<div key={m.id} style={{padding:'9px 12px',borderBottom:'1px solid '+C.brd+'88',background:isViewing?C.pan2:'transparent'}}>
          {editingId===m.id
            ?<input autoFocus value={editName} onChange={e=>setEditName(e.target.value)} onBlur={commitEdit}
                onKeyDown={e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')setEditingId(null);}}
                style={SI({fontSize:14,padding:'4px 8px',marginBottom:6})}/>
            :<div onClick={()=>onSelect(m.id)} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <span style={{fontSize:14,color:isViewing?C.cyl:C.txb,fontWeight:isViewing?'bold':'normal',flex:1}}>{m.name}</span>
              {isActive&&<span style={{fontSize:10,color:C.gnl,border:'1px solid '+C.gnl+'66',padding:'1px 7px',flexShrink:0}}>АКТИВНА</span>}
            </div>}
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <button onClick={()=>onSelect(m.id)} style={SB(C.brdl,C.tx,{padding:'3px 9px',fontSize:11})}>Открыть</button>
            <button onClick={()=>startEdit(m)} style={SB(C.brdl,C.tx,{padding:'3px 9px',fontSize:11})}>✎ Имя</button>
            {!isActive&&<button onClick={()=>onActivate(m.id)} style={SB(C.gnl,C.gnl,{padding:'3px 9px',fontSize:11})}>▶ Активировать</button>}
            {maps.length>1&&<button onClick={()=>onDelete(m.id)} style={SB(C.rdl+'66',C.rdl,{padding:'3px 9px',fontSize:11})}>✕</button>}
          </div>
        </div>;
      })}
      <div style={{padding:'8px 12px',fontSize:11,color:TX2,lineHeight:1.6}}>Активная карта видна игрокам. Остальные можно редактировать независимо, не влияя на то, что видят игроки.</div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
