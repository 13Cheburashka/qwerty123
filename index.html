// ─── HEALTH / BUFFER TRACKS (CP2020-style dot boxes) ───
const HP_MAX=40;      // 10 wound levels × 4 boxes each
const BUFFER_MAX=40;  // visual cap for the Buffer dot track
const BUF_BLUE='#4499ff';
const DOT_GROUP=4;    // visual grouping — matches the 4-box wound levels below
const WOUND_LEVELS=['Лёгкое ранение','Серьёзное ранение','Критическое ранение','Смертельно 0','Смертельно 1','Смертельно 2','Смертельно 3','Смертельно 4','Смертельно 5','Смертельно 6'];
function woundLevelIdx(dmg){
  const d=Math.max(0,Math.min(HP_MAX,+dmg||0));
  if(d===0)return -1;
  return Math.min(WOUND_LEVELS.length-1,Math.ceil(d/DOT_GROUP)-1);
}
function woundState(dmg){
  const idx=woundLevelIdx(dmg);
  return{label:idx<0?'Не ранен':WOUND_LEVELS[idx],idx,mortal:idx>=3};
}
// Critical (dmg 9-12): INT halved, rounded up. Mortal 0+ (dmg 13+): additionally −1. This is the max penalty.
function effectiveStats(profile){
  const st=(profile&&profile.stats)||{};
  if(!profile||profile.mobType==='blackice')return st;
  const d=Math.max(0,Math.min(HP_MAX,+profile.hpDamage||0));
  const base=pn(st.int);
  let eff=base;
  if(d>=13)eff=Math.max(0,Math.ceil(base/2)-1);
  else if(d>=9)eff=Math.max(0,Math.ceil(base/2));
  return{...st,int:eff};
}

// ─── STORAGE (Firebase + localStorage fallback) ───────
const HAS_WS=typeof window!=='undefined';
let FDB=null;
try{
  if(window.USE_FIREBASE&&typeof firebase!=='undefined'){
    firebase.initializeApp(window.FIREBASE_CONFIG);
    FDB=firebase.database();
  }
}catch(e){console.warn('Firebase:',e);}

const LS_SET=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const LS_GET=(k)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const path2key=p=>p.replace(/\//g,'__');

const DB={
  get:async p=>{
    if(FDB){const s=await FDB.ref(p).once('value');return s.val();}
    return LS_GET(path2key(p));
  },
  set:async(p,v)=>{
    if(FDB)return FDB.ref(p).set(v);
    LS_SET(path2key(p),v);
  },
  remove:async p=>{
    if(FDB)return FDB.ref(p).remove();
    try{localStorage.removeItem(path2key(p));}catch{}
  },
  sub:(p,cb)=>{
    if(FDB){
      const ref=FDB.ref(p);
      ref.on('value',s=>cb(s.val()));
      return()=>ref.off();
    }
    cb(LS_GET(path2key(p)));
    const t=setInterval(()=>cb(LS_GET(path2key(p))),1200);
    return()=>clearInterval(t);
  },
  // Subscribes to an entire node (all children at once) so edits to ANY existing
  // child fire live for everyone — not just additions/removals of the child list.
  subCollection:(prefix,cb)=>{
    if(FDB){
      const ref=FDB.ref(prefix);
      ref.on('value',s=>cb(s.val()||{}));
      return()=>ref.off();
    }
    const fullPrefix=path2key(prefix)+'__';
    const scan=()=>{
      const out={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&k.indexOf(fullPrefix)===0){
          const id=k.slice(fullPrefix.length);
          try{out[id]=JSON.parse(localStorage.getItem(k));}catch{}
        }
      }
      cb(out);
    };
    scan();
    const t=setInterval(scan,1200);
    return()=>clearInterval(t);
  }
};

// ─── DICE ENGINE ───────────────────────────────────────
function roll(expr){
  const s=String(expr??'').trim();
  if(!s||s==='—'||s==='-')return{val:0,str:'0'};
  const n=+s;if(!isNaN(n))return{val:n,str:s};
  if(!/^[\d\s+\-*/d().]+$/i.test(s))return{val:0,str:'ERR'};
  let d=s;
  let firstNatural=null;
  const ev=s.replace(/(\d+)d(\d+)/gi,(m,a,b)=>{
    const cnt=Math.min(+a,20), sides=Math.min(+b,9999);
    const dieStrs=[];let sum=0;
    for(let i=0;i<cnt;i++){
      // exploding dice: a natural 10 on a d10 triggers another roll, added on, chaining indefinitely
      let chain=[Math.floor(Math.random()*sides)+1];
      if(sides===10){
        while(chain[chain.length-1]===10) chain.push(Math.floor(Math.random()*10)+1);
      }
      if(firstNatural===null) firstNatural=chain[0];
      sum+=chain.reduce((x,y)=>x+y,0);
      dieStrs.push(chain.length>1?'('+chain.join('+')+')':String(chain[0]));
    }
    d=d.replace(m,'['+dieStrs.join('+')+']');return sum;
  });
  try{
    const v=Function('"use strict";return('+ev+')')();
    const out={val:Math.round(v*100)/100,str:d};
    if(firstNatural!==null)out.natural=firstNatural;
    return out;
  }
  catch{return{val:0,str:'ERR'};}
}
// Manual /r chat rolls: plain dice, NO explosion, shows each individual die
function rollManual(exprRaw){
  const s=String(exprRaw||'').trim();
  const m=s.match(/^(\d*)d(\d+)\s*([+-]\s*\d+)?$/i);
  if(!m)return null;
  const n=Math.max(1,Math.min(parseInt(m[1]||'1',10),50));
  const sides=Math.max(2,Math.min(parseInt(m[2],10),1000));
  const mod=m[3]?parseInt(m[3].replace(/\s+/g,''),10):0;
  const dice=Array.from({length:n},()=>Math.floor(Math.random()*sides)+1);
  const total=dice.reduce((a,b)=>a+b,0)+mod;
  return{dice,sides,mod,total};
}
const pn=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const ts=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

// ─── COMPUTED STATS ────────────────────────────────────
const actP=programs=>(programs||[]).filter(p=>p.status==='active');
const duAct=programs=>actP(programs).filter(p=>p.category==='defensive'||p.category==='support');

// Global crit/fumble thresholds: only defensive/support programs affect the deck-wide value
function globalCrit(programs){
  return Math.max(6,Math.min(10,10+duAct(programs).reduce((s,p)=>s+(+p.crit_mod||0),0)));
}
function globalFumble(programs,bugs){
  return Math.max(0,Math.min(5,1+duAct(programs).reduce((s,p)=>s+(+p.fumble_mod||0),0)+(bugs?.[6]||0)));
}
// Per-attacking-program threshold = global + that program's own mod (does NOT change the global value)
function atkCrit(prog,programs){
  return Math.max(6,Math.min(10,globalCrit(programs)+(+prog.crit_mod||0)));
}
function atkFumble(prog,programs,bugs){
  return Math.max(0,Math.min(5,globalFumble(programs,bugs)+(+prog.fumble_mod||0)));
}
// DV is now a BONUS to defense (not a static override)
function defenseBonus(programs,bugs){
  return duAct(programs).reduce((s,p)=>s+pn(p.dv),0)-(bugs?.[8]||0);
}
function defenseValue(stats,programs,bugs){
  return pn(stats?.int)+pn(stats?.iface)+defenseBonus(programs,bugs);
}
function calcSpeed(stats,programs,bugs){
  return pn(stats?.int)+duAct(programs).reduce((s,p)=>s+pn(p.spd_bonus),0)-(bugs?.[1]||0)*3;
}
const bugHitPen=bugs=>(bugs?.[2]||0);
const bugDmgPen=bugs=>(bugs?.[3]||0);

// ─── GENERIC ROLL COMPUTATION (shared: players, demons, black ice) ───
// entity = {mobType:'player'|'demon'|'blackice', stats, programs, bugs, strength, speedStat}
function computeAttack(entity, prog, manualBonus){
  const d10=roll('1d10');
  const man=roll(manualBonus||'0');
  if(entity.mobType==='blackice'){
    const str=pn(entity.strength);
    const ownHit=roll(prog?.hit_bonus||'0');
    let total=Math.round((d10.val+str+ownHit.val+man.val)*100)/100;
    const ownHitTxt=(prog?.hit_bonus&&String(prog.hit_bonus).trim()&&prog.hit_bonus!=='0')?` + Прог.бонус[${ownHit.str}]`:'';
    const expr=`1d10=${d10.str} + СИЛА(${entity.strength||0})`+ownHitTxt+(man.val?` + Бонус[${man.str}]`:'');
    let dmgR=null,dmgP=null;
    if(prog?.dmg_runners){const b=roll(prog.dmg_runners);dmgR={total:Math.max(1,b.val),parts:[b.str]};}
    if(prog?.dmg_programs){const b=roll(prog.dmg_programs);dmgP={total:Math.max(1,b.val),parts:[b.str]};}
    return{hitTotal:total,hitExpr:expr,isCrit:false,isCritExplode:false,isFum:false,d10val:d10.natural,critT:null,fumT:null,dmgR,dmgP};
  }
  const programs=entity.programs||[];
  const bugs=entity.bugs||defBugs();
  const critT=atkCrit(prog,programs), fumT=atkFumble(prog,programs,bugs);
  const iface=roll(entity.stats?.iface||'0');
  const intR=roll(entity.stats?.int||'0');
  const ownHit=roll(prog.hit_bonus||'0');
  const hitMods=duAct(programs).filter(p=>p.hit_bonus&&String(p.hit_bonus).trim());
  const hitR=hitMods.map(p=>({name:p.name,r:roll(p.hit_bonus)}));
  const hp=bugHitPen(bugs);
  let ht=d10.val+intR.val+iface.val+ownHit.val+hitR.reduce((s,m)=>s+m.r.val,0)-hp+man.val;
  ht=Math.round(ht*100)/100;
  // crit/fumble compare the NATURAL (pre-explosion) d10 value — exploding dice never affect crit chance
  const isCrit=d10.natural>=critT, isFum=d10.natural<=fumT;
  const isCritExplode=d10.natural===10;

  const dp=bugDmgPen(bugs);
  const dRmods=duAct(programs).filter(p=>p.dmg_bonus_runners&&String(p.dmg_bonus_runners).trim());
  const dPmods=duAct(programs).filter(p=>p.dmg_bonus_programs&&String(p.dmg_bonus_programs).trim());
  let dmgR=null,dmgP=null;
  if(prog.dmg_runners){
    const b=roll(prog.dmg_runners);
    const br=dRmods.map(p=>({name:p.name,r:roll(p.dmg_bonus_runners)}));
    const tot=Math.max(1,Math.round((b.val+br.reduce((s,m)=>s+m.r.val,0)-dp)*100)/100);
    dmgR={total:tot,parts:[b.str,...br.map(m=>'+'+m.name+'['+m.r.str+']'),dp?'-Bug#3['+dp+']':''].filter(Boolean)};
  }
  if(prog.dmg_programs){
    const b=roll(prog.dmg_programs);
    const br=dPmods.map(p=>({name:p.name,r:roll(p.dmg_bonus_programs)}));
    const tot=Math.max(1,Math.round((b.val+br.reduce((s,m)=>s+m.r.val,0)-dp)*100)/100);
    dmgP={total:tot,parts:[b.str,...br.map(m=>'+'+m.name+'['+m.r.str+']'),dp?'-Bug#3['+dp+']':''].filter(Boolean)};
  }
  const ownHitTxt=(prog.hit_bonus&&String(prog.hit_bonus).trim()&&prog.hit_bonus!=='0')?` + Прог.бонус[${ownHit.str}]`:'';
  const hitExpr=`1d10=${d10.str} + INT[${intR.str}] + IFACE[${iface.str}]`+ownHitTxt
    +hitR.map(m=>` + ${m.name}[${m.r.str}]`).join('')
    +(hp?` − Bug#2[${hp}]`:'')
    +(man.val?` + Бонус[${man.str}]`:'');
  return{hitTotal:ht,hitExpr,isCrit,isCritExplode,isFum,d10val:d10.natural,critT,fumT,dmgR,dmgP};
}

function computeDefense(entity, manualBonus){
  const man=roll(manualBonus||'0');
  if(entity.mobType==='blackice'){
    const d10=roll('1d10');
    const str=pn(entity.strength);
    const mod=pn(entity.defenseMod);
    const total=Math.round((str+d10.val+mod+man.val)*100)/100;
    const expr=`СИЛА(${entity.strength||0}) + 1d10=${d10.str}`+(mod?` + Мод[${mod>0?'+':''}${mod}]`:'')+(man.val?` + Бонус[${man.str}]`:'');
    return{total,expr,isRoll:true,d10val:d10.natural};
  }
  const d10=roll('1d10');
  const programs=entity.programs||[];
  const bugs=entity.bugs||defBugs();
  const bonus=defenseBonus(programs,bugs);
  const total=Math.round((d10.val+pn(entity.stats?.int)+pn(entity.stats?.iface)+bonus+man.val)*100)/100;
  const dvMods=duAct(programs).filter(p=>p.dv&&String(p.dv).trim());
  const expr=`1d10=${d10.str} + INT(${entity.stats?.int||0}) + IFACE(${entity.stats?.iface||0})`
    +dvMods.map(p=>` + ${p.name}[${p.dv}]`).join('')
    +((bugs?.[8]||0)?` − Bug#8[${bugs[8]}]`:'')
    +(man.val?` + Бонус[${man.str}]`:'');
  return{total,expr,isRoll:true,d10val:d10.natural};
}

function computeGenericRoll(entity, manualBonus){
  const d10=roll('1d10');
  const man=roll(manualBonus||'0');
  const intR=roll(entity.stats?.int||'0');
  const ifaceR=roll(entity.stats?.iface||'0');
  const total=Math.round((d10.val+intR.val+ifaceR.val+man.val)*100)/100;
  const expr=`1d10=${d10.str} + INT[${intR.str}] + IFACE[${ifaceR.str}]`+(man.val?` + Бонус[${man.str}]`:'');
  return{total,expr,d10val:d10.val};
}

function computeInit(entity, manualBonus){
  const d10=roll('1d10');
  const man=roll(manualBonus||'0');
  if(entity.mobType==='blackice'){
    const spd=pn(entity.speedStat);
    const total=Math.round((d10.val+spd+man.val)*100)/100;
    const expr=`1d10=${d10.str} + СКОРОСТЬ(${entity.speedStat||0})`+(man.val?` + Бонус[${man.str}]`:'');
    return{total,expr};
  }
  const programs=entity.programs||[];
  const bugs=entity.bugs||defBugs();
  const intR=roll(entity.stats?.int||'0');
  const spdM=duAct(programs).filter(p=>p.spd_bonus&&String(p.spd_bonus).trim());
  const spdR=spdM.map(p=>({name:p.name,r:roll(p.spd_bonus)}));
  const bs=(bugs[1]||0)*3;
  let total=d10.val+intR.val+spdR.reduce((s,m)=>s+m.r.val,0)-bs+man.val;
  total=Math.round(total*100)/100;
  const expr=`1d10=${d10.str} + INT[${intR.str}]`
    +spdR.map(m=>` + ${m.name}[${m.r.str}]`).join('')
    +(bs?` − Bug#1[${bs}]`:'')
    +(man.val?` + Бонус[${man.str}]`:'');
  return{total,expr};
}

const SI=(ex={})=>({background:C.pan3,border:'1px solid '+C.brdl,color:C.txb,fontSize:'17px',padding:'7px 10px',outline:'none',width:'100%',fontFamily:C.fn,...ex});
const SB=(bc,tc,ex={})=>({background:'transparent',border:'1px solid '+(bc||C.brdl),color:tc||C.tx,fontFamily:C.fn,fontSize:'15px',padding:'6px 14px',cursor:'pointer',letterSpacing:'1px',...ex});

// ══════════════════════════════════════════════════════
//   APP
// ══════════════════════════════════════════════════════
function App(){
  const [phase,setPhase]=useState('boot');
  const [myId,setMyId]=useState(null);
  const [myP,setMyP]=useState(null);
  const [roster,setRoster]=useState([]);
  const [logs,setLogs]=useState([]);
  const [modal,setModal]=useState(null); // {t, ref, prog, d}
  const [showLib,setShowLib]=useState(false);
  const [showPicker,setShowPicker]=useState(false);
  const [showMaps,setShowMaps]=useState(false);
  const [maps,setMaps]=useState([]);
  const [activeMapId,setActiveMapId]=useState(null);
  const [viewMapId,setViewMapId]=useState(null); // GM's own browsing state; players always see activeMapId
  const [openWindows,setOpenWindows]=useState([]);
  const zRef=useRef(10);
  const logRef=useRef(null);
  const unsubs=useRef([]);

  useEffect(()=>{
    setPhase('login');
    return()=>unsubs.current.forEach(f=>f?.());
  },[]);

  const boot=(id,p)=>{
    setMyId(id);setMyP(p);setPhase('main');
    unsubs.current.push(
      DB.subCollection('cp20/profiles',val=>{
        const v=Object.values(val||{}).filter(Boolean);
        setRoster(v);
        const m=v.find(x=>x.id===id);
        if(m)setMyP(m);
      }),
      DB.sub('cp20/logs',val=>{
        if(!val)return;
        const arr=(Array.isArray(val)?val:Object.values(val)).filter(Boolean);
        setLogs(arr.slice(-MAX_LOG));
      }),
      DB.subCollection('cp20/maps',val=>{
        setMaps(Object.values(val||{}).filter(Boolean));
      }),
      DB.sub('cp20/activeMapId',val=>{
        setActiveMapId(val||null);
        setViewMapId(cur=>cur||val||null);
      })
    );
    if(p.isGM){
      (async()=>{
        const existing=await DB.get('cp20/maps');
        if(!existing||Object.keys(existing).length===0){
          const mapId=uid();
          const defaultMap={id:mapId,name:'Карта 1',points:[],lines:[],strokes:[],fog:{baseRevealed:false,strokes:[]}};
          await DB.set('cp20/maps/'+mapId,defaultMap);
          await DB.set('cp20/activeMapId',mapId);
        }
      })();
    }
    setOpenWindows(ws=>ws.length?ws:[{id:uid(),ref:{type:'player',id},x:70,y:70,w:660,h:580,z:++zRef.current}]);
  };

  const saveP=async p=>{
    await DB.set('cp20/profiles/'+p.id,p);
    if(p.id===myId)setMyP(p);
    setRoster(r=>{const i=r.findIndex(x=>x.id===p.id);if(i>=0){const n=[...r];n[i]=p;return n;}return[...r,p];});
  };

  const addLog=async(action,pr,detail,type='info')=>{
    const p=pr||myP;if(!p)return;
    const prev=await DB.get('cp20/logs')||[];
    const arr=(Array.isArray(prev)?prev:Object.values(prev)).filter(Boolean);
    const e={id:uid(),from:p.handle,color:p.color,action,detail:detail||'',type,t:ts()};
    const next=[...arr,e].slice(-MAX_LOG);
    await DB.set('cp20/logs',next);
    setLogs(next);
  };

  const onLogin=async({handle,color,isGM})=>{
    const accountKey=isGM?'__GM__':color.replace('#','').toLowerCase();
    const existingId=await DB.get('cp20/colormap/'+accountKey);
    let p=existingId?await DB.get('cp20/profiles/'+existingId):null;
    if(p){
      if(p.handle!==handle){p={...p,handle};await DB.set('cp20/profiles/'+p.id,p);}
      LS_SET('cp20_myid',p.id);
      await addLog(`ПОДКЛЮЧИЛСЯ (${isGM?'GM':color})`,p,'','system');
      boot(p.id,p);
    } else {
      const id=isGM?'GM_ACCOUNT':uid();
      p={id,handle,color:isGM?'#ee4455':color,isGM,
        stats:{int:'',iface:''},cyberdeck:{name:'',memory:'',speed_raw:'',defense:''},
        programs:[],bugs:defBugs(),hpDamage:0,bufferUsed:0};
      await DB.set('cp20/colormap/'+accountKey,id);
      LS_SET('cp20_myid',id);
      await saveP(p);
      await addLog('СОЗДАЛ АККАУНТ И ПОДКЛЮЧИЛСЯ',p,'','system');
      boot(id,p);
    }
  };

  const onLogout=async()=>{
    if(myP)await addLog('ОТКЛЮЧИЛСЯ',myP,'','system');
    LS_SET('cp20_myid',null);
    unsubs.current.forEach(f=>f?.());
    setPhase('login');setMyId(null);setMyP(null);setRoster([]);setLogs([]);setOpenWindows([]);
  };

  // ── Mobs (loaded for GM only) ─────────────────────────
  const [mobRoster,setMobRoster]=useState([]);
  const mobUnsub=useRef(null);
  useEffect(()=>{
    if(!(myP&&myP.isGM))return;
    mobUnsub.current=DB.subCollection('cp20/mobs',val=>{
      setMobRoster(Object.values(val||{}).filter(Boolean));
    });
    return()=>mobUnsub.current?.();
  },[myP?.isGM]);

  const saveMob=async m=>{
    await DB.set('cp20/mobs/'+m.id,m);
    setMobRoster(r=>{const i=r.findIndex(x=>x.id===m.id);if(i>=0){const n=[...r];n[i]=m;return n;}return[...r,m];});
  };
  const onMobCreate=async(type)=>{
    const id=uid();
    const color=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    let m;
    if(type==='blackice'){
      m={id,mobType:'blackice',handle:'Новый Лёд',color,strength:'',speedStat:'',defenseMod:'',hp:'',programs:[],bugs:defBugs()};
    } else {
      m={id,mobType:'demon',handle:'Новый Демон',color,isGM:false,hp:'',
        stats:{int:'',iface:''},cyberdeck:{name:'',memory:'',speed_raw:'',defense:''},
        programs:[],bugs:defBugs(),hpDamage:0,bufferUsed:0};
    }
    await saveMob(m);
    return id;
  };
  const onMobDelete=async(mobId)=>{
    await DB.remove('cp20/mobs/'+mobId);
    setMobRoster(r=>r.filter(x=>x.id!==mobId));
    setOpenWindows(ws=>ws.filter(w=>w.ref.id!==mobId));
  };
  const onMobField=async(mob,field,val)=>{ await saveMob({...mob,[field]:val}); };

  // ── Map sync ─────────────────────────────────────────
  const saveMapEntry=async(mapId,next)=>{
    setMaps(ms=>ms.map(m=>m.id===mapId?next:m));
    await DB.set('cp20/maps/'+mapId,next);
  };
  const onMapCreate=async()=>{
    const mapId=uid();
    const n={id:mapId,name:`Карта ${maps.length+1}`,points:[],lines:[],strokes:[],fog:{baseRevealed:false,strokes:[]}};
    await DB.set('cp20/maps/'+mapId,n);
    setMaps(ms=>[...ms,n]);
    setViewMapId(mapId);
    return mapId;
  };
  const onMapDelete=async mapId=>{
    if(maps.length<=1)return;
    await DB.remove('cp20/maps/'+mapId);
    const remaining=maps.filter(m=>m.id!==mapId);
    setMaps(remaining);
    if(activeMapId===mapId&&remaining[0]){await DB.set('cp20/activeMapId',remaining[0].id);}
    setViewMapId(cur=>cur===mapId?(remaining[0]?.id||null):cur);
  };
  const onMapRename=async(mapId,name)=>{
    const m=maps.find(x=>x.id===mapId);
    if(m)await saveMapEntry(mapId,{...m,name});
  };
  const onMapActivate=async mapId=>{
    setActiveMapId(mapId);
    await DB.set('cp20/activeMapId',mapId);
  };

  // ── Window manager ─────────────────────────────────────
  const openWindow=ref=>{
    setOpenWindows(ws=>{
      const ex=ws.find(w=>w.ref.type===ref.type&&w.ref.id===ref.id);
      zRef.current+=1;
      if(ex)return ws.map(w=>w===ex?{...w,z:zRef.current}:w);
      const n=ws.length;
      return[...ws,{id:uid(),ref,x:60+((n*34)%260),y:60+((n*28)%220),w:660,h:580,z:zRef.current}];
    });
  };
  const closeWindow=id=>setOpenWindows(ws=>ws.filter(w=>w.id!==id));
  const focusWindow=id=>{zRef.current+=1;setOpenWindows(ws=>ws.map(w=>w.id===id?{...w,z:zRef.current}:w));};
  const moveWindow=(id,x,y)=>setOpenWindows(ws=>ws.map(w=>w.id===id?{...w,x,y}:w));
  const resizeWindow=(id,w_,h_)=>setOpenWindows(ws=>ws.map(w=>w.id===id?{...w,w:w_,h:h_}:w));

  // ── Entity resolution: player (self/other) or mob, by ref ──
  const resolveEntity=ref=>{
    if(!ref)return null;
    if(ref.type==='player'){
      if(ref.id===myId)return myP;
      return roster.find(p=>p.id===ref.id)||null;
    }
    return mobRoster.find(m=>m.id===ref.id)||null;
  };
  const saveEntity=async e=>{
    if(e.mobType==='blackice'||e.mobType==='demon')await saveMob(e);
    else await saveP(e);
  };

  const onEntityStat=async(ref,f,v)=>{const e=resolveEntity(ref);if(!e)return;await saveEntity({...e,stats:{...e.stats,[f]:v}});};
  const onEntityDeck=async(ref,f,v)=>{const e=resolveEntity(ref);if(!e)return;await saveEntity({...e,cyberdeck:{...e.cyberdeck,[f]:v}});};
  const onEntityHp=async(ref,v)=>{const e=resolveEntity(ref);if(!e)return;await saveEntity({...e,hp:v});};
  const onEntityHpDamage=async(ref,v)=>{const e=resolveEntity(ref);if(!e)return;await saveEntity({...e,hpDamage:Math.max(0,Math.min(HP_MAX,v))});};
  const onEntityBufferUsed=async(ref,v)=>{const e=resolveEntity(ref);if(!e)return;await saveEntity({...e,bufferUsed:Math.max(0,Math.min(BUFFER_MAX,v))});};
  const onEntitySaveProg=async(ref,prog)=>{
    const e=resolveEntity(ref);if(!e)return;
    const isNew=!prog.id;
    const p=isNew?{...prog,id:uid(),status:'active'}:prog;
    const progs=isNew?[...(e.programs||[]),p]:(e.programs||[]).map(x=>x.id===p.id?p:x);
    await saveEntity({...e,programs:progs});
    setModal(null);
  };
  const onEntityDelProg=async(ref,id)=>{const e=resolveEntity(ref);if(!e)return;await saveEntity({...e,programs:(e.programs||[]).filter(p=>p.id!==id)});};
  const onEntityCycle=async(ref,progId)=>{
    const e=resolveEntity(ref);if(!e)return;
    const progs=(e.programs||[]).map(p=>{if(p.id!==progId)return p;const i=SCYCLE.indexOf(p.status||'active');return{...p,status:SCYCLE[(i+1)%3]};});
    await saveEntity({...e,programs:progs});
  };
  const onEntityBug=async(ref,bugId,val)=>{const e=resolveEntity(ref);if(!e)return;await saveEntity({...e,bugs:{...(e.bugs||defBugs()),[bugId]:Math.max(0,val)}});};

  const addRandBugTo=async entity=>{
    const id=Math.floor(Math.random()*10)+1;
    const bugs={...(entity.bugs||defBugs())};
    bugs[id]=(bugs[id]||0)+1;
    await saveEntity({...entity,bugs});
    await addLog(`⚠ ПРОВАЛ! Баг #${id} «${BUGS.find(b=>b.id===id)?.label}» +1 (стаков: ${bugs[id]})`,entity,'','fumble');
  };
  const onEntityGlitch=async ref=>{const e=resolveEntity(ref);if(!e)return;await addRandBugTo(e);};

  const asRollEntity=e=>({mobType:e.mobType||'player',stats:effectiveStats(e),programs:e.programs,bugs:e.bugs,strength:e.strength,speedStat:e.speedStat,defenseMod:e.defenseMod});

  const onEntityRollAtk=async(ref,prog,manBonus)=>{
    const e=resolveEntity(ref);if(!e)return null;
    const res=computeAttack(asRollEntity(e),prog,manBonus);
    await addLog(`⚔ АТАКА «${prog.name}»`,e,JSON.stringify(res),res.isCritExplode?'critexplode':res.isCrit?'crit':res.isFum?'fumble':'roll');
    if(res.isFum)await addRandBugTo(e);
    return res;
  };
  const onEntityRollInit=async(ref,manBonus)=>{
    const e=resolveEntity(ref);if(!e)return null;
    const res=computeInit(asRollEntity(e),manBonus);
    await addLog(`🎲 ИНИЦИАТИВА`,e,JSON.stringify(res),'roll');
    return res;
  };
  const onEntityRollDef=async(ref,manBonus)=>{
    const e=resolveEntity(ref);if(!e)return null;
    const res=computeDefense(asRollEntity(e),manBonus);
    await addLog(`🛡 ЗАЩИТА`,e,JSON.stringify(res),'roll');
    return res;
  };
  const onEntityRollGeneric=async(ref,manBonus)=>{
    const e=resolveEntity(ref);if(!e)return null;
    const res=computeGenericRoll(asRollEntity(e),manBonus);
    await addLog(`🎲 БРОСОК`,e,JSON.stringify(res),'roll');
    return res;
  };
  const onEntityPingProg=async(ref,prog)=>{
    const e=resolveEntity(ref);if(!e)return;
    await addLog(`📡 ПИНГ: «${prog.name}»`,e,JSON.stringify({ping:true,prog}),'ping');
  };
  const onEntityRollProg=async(ref,prog)=>{
    const e=resolveEntity(ref);if(!e)return;
    const r=roll(prog.roll_dice||'0');
    await addLog(`🎲 «${prog.name}»`,e,JSON.stringify({total:r.val,expr:r.str}),'roll');
  };

  const onChatMsg=async txt=>{
    const trimmed=txt.trim();
    const m=trimmed.match(/^\/r\s+(.+)$/i);
    if(m){
      const rm=rollManual(m[1]);
      if(rm)await addLog(`🎲 /r ${m[1].trim()}`,myP,JSON.stringify({manual:true,...rm}),'roll');
      else await addLog(`⚠ Неверный формат. Пример: /r 2d10 или /r 1d10+3`,myP,'','system');
      return;
    }
    await addLog(`💬 ${trimmed}`,myP,'','info');
  };

  const [libTarget,setLibTarget]=useState(null); // ref of the window that opened the Library
  const onInstallFromLib=async(libProg,ver)=>{
    const ref=libTarget||{type:'player',id:myId};
    const e=resolveEntity(ref);
    if(!e)return false;
    if(e.mobType==='blackice'&&libProg.category!=='attacking')return false;
    const newProg={
      id:uid(),name:`${libProg.name} v${ver.v}`,category:libProg.category,status:'active',
      price:ver.price||'',mu:ver.mu||'',
      hit_bonus:ver.hit_bonus||'',dmg_runners:ver.dmg_runners||'',dmg_programs:ver.dmg_programs||'',
      dv:ver.dv||'',spd_bonus:ver.spd_bonus||'',
      dmg_bonus_runners:'',dmg_bonus_programs:'',crit_mod:'',fumble_mod:'',
      detectDifficulty:ver.detectDifficulty||'',duration:ver.duration||'',activations:ver.activations||'',
      cooldown:ver.cooldown||'',
      verLabel:ver.v||'',notes:[ver.diff,ver.effect].filter(Boolean).join(' '),
      description:[libProg.description||'',ver.diff?`Особенности: ${ver.diff}`:'',ver.effect?`Эффект: ${ver.effect}`:'']
        .filter(Boolean).join('\n'),
    };
    await saveEntity({...e,programs:[...(e.programs||[]),newProg]});
    return true;
  };

  if(phase==='boot')return<div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:C.bg,fontFamily:C.fn,color:C.aml,fontSize:14,letterSpacing:4}}>ИНИЦИАЛИЗАЦИЯ...</div>;
  if(phase==='login')return<Login onLogin={onLogin}/>;

  return(
    <div style={{position:'fixed',inset:0,display:'flex',flexDirection:'column',background:C.bg,fontFamily:C.fn,color:C.tx}}>
      <TopBar myP={myP} onLogout={onLogout} onPickChar={()=>setShowPicker(s=>!s)} pickerActive={showPicker}
        onLib={()=>setShowLib(l=>!l)} libActive={showLib}
        onMaps={()=>setShowMaps(s=>!s)} mapsActive={showMaps}/>
      <div style={{flex:1,display:'flex',overflow:'hidden',minHeight:0,position:'relative'}}>
        {(()=>{
          const shownId=myP?.isGM?(viewMapId||activeMapId):activeMapId;
          const shownMap=maps.find(m=>m.id===shownId)||{points:[],lines:[],strokes:[],fog:{baseRevealed:false,strokes:[]}};
          return<MapCanvas mapState={shownMap} onChange={next=>saveMapEntry(shownId,next)} isGM={!!myP?.isGM}
            myId={myId} myColor={myP?.color} myName={myP?.handle} roster={roster.filter(p=>!p.isGM)}/>;
        })()}
        <LogPanel logs={logs} logRef={logRef} onSendMsg={myP?onChatMsg:null}/>

        {openWindows.map(w=>{
          const entity=resolveEntity(w.ref);
          if(!entity)return null;
          const isSelf=entity.id===myId;
          const canEdit=isSelf||!!myP?.isGM;
          const badge=(!isSelf&&myP?.isGM)?(entity.mobType?'GM УПРАВЛЯЕТ МОБОМ':'GM РЕДАКТИРУЕТ ИГРОКА'):null;
          const ref=w.ref;
          const openLibFor=()=>{setLibTarget(ref);setShowLib(true);};
          return<FloatingWindow key={w.id} win={w} title={entity.handle} color={entity.color}
            onClose={()=>closeWindow(w.id)} onFocus={()=>focusWindow(w.id)} onMove={moveWindow} onResize={resizeWindow}>
            <div style={{background:C.pan,borderBottom:'1px solid '+C.brd,padding:'6px 10px',display:'flex',gap:6,flexWrap:'wrap',flexShrink:0}}>
              {canEdit&&<button onClick={()=>onEntityGlitch(ref)} style={{...SB(C.rdl,C.rdl,{fontSize:12,padding:'4px 10px'})}}>⚡ Глюк</button>}
              {canEdit&&<button onClick={()=>setModal({t:'def',ref})} style={{...SB(C.gnl,C.gnl,{fontSize:12,padding:'4px 10px'})}}>🛡 Защита</button>}
              {canEdit&&<button onClick={()=>setModal({t:'init',ref})} style={{...SB(C.cyl,C.cyl,{fontSize:12,padding:'4px 10px'})}}>🎲 Иниц.</button>}
              {canEdit&&<button onClick={()=>setModal({t:'roll',ref})} style={{...SB(C.org,C.org,{fontSize:12,padding:'4px 10px'})}}>🎲 Бросок</button>}
              {canEdit&&<button onClick={openLibFor} style={{...SB(C.gnl+'88',C.gnl,{fontSize:12,padding:'4px 10px'})}}>📚 База</button>}
              {entity.mobType&&canEdit&&<button onClick={()=>{onMobDelete(entity.id);closeWindow(w.id);}} style={{...SB(C.rdl+'55',C.rdl,{fontSize:12,padding:'4px 10px'})}}>✕ Удалить моба</button>}
            </div>
            {entity.mobType==='blackice'
              ?<BlackIceEditor mob={entity} onField={onMobField} onHp={v=>onEntityHp(ref,v)} isOwn={canEdit}
                  onDelete={()=>{onMobDelete(entity.id);closeWindow(w.id);}}
                  onAtk={prog=>setModal({t:'atk',ref,prog:prog||{name:entity.handle}})}
                  onAdd={canEdit?(()=>setModal({t:'prog',ref,d:null})):null}
                  onEdit={canEdit?(p=>setModal({t:'prog',ref,d:p})):null}
                  onDelProg={canEdit?(id=>onEntityDelProg(ref,id)):null}
                  onCycle={canEdit?(id=>onEntityCycle(ref,id)):null}
                  onPing={canEdit?(prog=>onEntityPingProg(ref,prog)):null}/>
              :<Sheet profile={entity} isOwn={canEdit} badge={badge}
                  onStat={canEdit?((f,v)=>onEntityStat(ref,f,v)):null}
                  onDeck={canEdit?((f,v)=>onEntityDeck(ref,f,v)):null}
                  onHp={canEdit?(v=>onEntityHp(ref,v)):null}
                  onHpDamage={canEdit?(v=>onEntityHpDamage(ref,v)):null}
                  onBufferUsed={canEdit?(v=>onEntityBufferUsed(ref,v)):null}
                  onAdd={canEdit?(()=>setModal({t:'prog',ref,d:null})):null}
                  onEdit={canEdit?(p=>setModal({t:'prog',ref,d:p})):null}
                  onDel={canEdit?(id=>onEntityDelProg(ref,id)):null}
                  onCycle={canEdit?(id=>onEntityCycle(ref,id)):null}
                  onAtk={canEdit?(p=>setModal({t:'atk',ref,prog:p})):null}
                  onBug={canEdit?((id,v)=>onEntityBug(ref,id,v)):null}
                  onRename={(entity.mobType&&canEdit)?(v=>onMobField(entity,'handle',v)):null}
                  onPing={canEdit?(prog=>onEntityPingProg(ref,prog)):null}
                  onRollProg={canEdit?(prog=>onEntityRollProg(ref,prog)):null}/>}
          </FloatingWindow>;
        })}

        {showPicker&&<CharPicker roster={roster} mobRoster={mobRoster} myId={myId} isGM={!!myP?.isGM}
          onOpen={openWindow} onClose={()=>setShowPicker(false)} onCreateMob={onMobCreate}/>}
        {showMaps&&myP?.isGM&&<MapsPanel maps={maps} activeMapId={activeMapId} viewMapId={viewMapId}
          onSelect={id=>{setViewMapId(id);setShowMaps(false);}} onActivate={onMapActivate}
          onCreate={onMapCreate} onRename={onMapRename} onDelete={onMapDelete} onClose={()=>setShowMaps(false)}/>}
      </div>

      {modal?.t==='prog'&&<Ov onClose={()=>setModal(null)}>
        <ProgModal ini={modal.d} onSave={p=>onEntitySaveProg(modal.ref,p)} onClose={()=>setModal(null)}
          lockCategory={resolveEntity(modal.ref)?.mobType==='blackice'?'attacking':null}/>
      </Ov>}
      {modal?.t==='atk'&&resolveEntity(modal.ref)&&<Ov onClose={()=>setModal(null)}>
        <AtkModal prog={modal.prog} entity={asRollEntity(resolveEntity(modal.ref))} onRoll={(p,m)=>onEntityRollAtk(modal.ref,p,m)} onClose={()=>setModal(null)}/>
      </Ov>}
      {modal?.t==='init'&&resolveEntity(modal.ref)&&<Ov onClose={()=>setModal(null)}>
        <InitModal entity={asRollEntity(resolveEntity(modal.ref))} onRoll={m=>onEntityRollInit(modal.ref,m)} onClose={()=>setModal(null)}/>
      </Ov>}
      {modal?.t==='def'&&resolveEntity(modal.ref)&&<Ov onClose={()=>setModal(null)}>
        <DefModal entity={asRollEntity(resolveEntity(modal.ref))} onRoll={m=>onEntityRollDef(modal.ref,m)} onClose={()=>setModal(null)}/>
      </Ov>}
      {modal?.t==='roll'&&resolveEntity(modal.ref)&&<Ov onClose={()=>setModal(null)}>
        <RollModal entity={asRollEntity(resolveEntity(modal.ref))} onRoll={m=>onEntityRollGeneric(modal.ref,m)} onClose={()=>setModal(null)}/>
      </Ov>}

      {showLib&&<LibraryPanel onClose={()=>setShowLib(false)} onInstall={onInstallFromLib} isGM={!!myP?.isGM}/>}
    </div>
  );
}

function RenameField({value,onChange,color}){
  const [ed,setEd]=useState(false);const [v,setV]=useState(value||'');
  useEffect(()=>setV(value||''),[value]);
  const commit=()=>{setEd(false);if(v.trim()&&v!==value)onChange(v.trim());else setV(value||'');};
  if(ed)return<input autoFocus value={v} onChange={e=>setV(e.target.value)} onBlur={commit}
    onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){setV(value||'');setEd(false);}}}
    style={{...SI({fontSize:19,padding:'3px 8px',width:220}),fontFamily:C.or,color,letterSpacing:2}}/>;
  return<span onClick={()=>setEd(true)} title="Нажмите чтобы переименовать" style={{fontFamily:C.or,fontSize:19,color,letterSpacing:2,cursor:'pointer',borderBottom:'1px dashed '+color+'66'}}>{value} <span style={{fontSize:12,color:TX2}}>✎</span></span>;
}

// ── CP2020-style dot tracks (Health / Buffer) ───────────
function DotRow({count,filled,activeCount,colorFilled,colorEmpty,colorInactive,onClick,isOwn,size=15,group=DOT_GROUP}){
  return<div style={{display:'flex',flexWrap:'wrap',gap:4,rowGap:9}}>
    {Array.from({length:count}).map((_,i)=>{
      const isActive=activeCount===undefined||i<activeCount;
      const isFilled=i<filled;
      const clickable=isOwn&&isActive&&!!onClick;
      const groupBreak=group&&(i+1)%group===0&&i!==count-1;
      return<div key={i} onClick={()=>clickable&&onClick(i)}
        style={{width:size,height:size,borderRadius:'50%',flexShrink:0,
          marginRight:groupBreak?11:0,
          border:'1.5px solid '+(isActive?colorEmpty:colorInactive),
          background:isFilled?colorFilled:'transparent',
          opacity:isActive?1:0.3,cursor:clickable?'pointer':'default',
          transition:'all .1s',boxShadow:isFilled?'0 0 5px '+colorFilled+'aa':'none'}}/>;
    })}
  </div>;
}
// cascading fill: clicking dot p fills 1..p; clicking within the already-filled range clears back to p-1
const dotCascade=(i,cur)=>{const p=i+1;return p<=cur?p-1:p;};
function HealthTrack({dmg,onChange,isOwn,baseInt}){
  const d=dmg||0;
  const ws=woundState(d);
  const penText=d>=13?' (ИНТ ÷2, −1)':d>=9?' (ИНТ ÷2)':'';
  return<div style={{marginBottom:14}}>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:7,flexWrap:'wrap'}}>
      <span style={{fontSize:11,color:TX2,letterSpacing:2}}>ЗДОРОВЬЕ</span>
      <span style={{fontSize:12,color:ws.idx>=0?C.rdll:C.gnl,fontWeight:'bold'}}>{ws.label}{penText}</span>
      <span style={{fontSize:11,color:TX2,marginLeft:'auto'}}>{d}/{HP_MAX}</span>
    </div>
    <DotRow count={HP_MAX} filled={d} colorFilled={C.txb} colorEmpty={C.brdl} colorInactive={C.brdl}
      onClick={onChange?(i=>onChange(dotCascade(i,d))):null} isOwn={isOwn}/>
  </div>;
}
function BufferTrack({used,capacity,onChange,isOwn}){
  const u=used||0;
  const active=Math.max(0,Math.min(BUFFER_MAX,Math.floor(capacity)||0));
  return<div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:7,flexWrap:'wrap'}}>
      <span style={{fontSize:11,color:TX2,letterSpacing:2}}>БУФЕР</span>
      <span style={{fontSize:11,color:C.cyl,marginLeft:'auto'}}>{u}/{active}</span>
    </div>
    <DotRow count={BUFFER_MAX} filled={u} activeCount={active} colorFilled={BUF_BLUE} colorEmpty={C.cyl} colorInactive={C.brd}
      onClick={onChange?(i=>onChange(dotCascade(i,u))):null} isOwn={isOwn}/>
  </div>;
}

// ── Profile Sheet (used for both players AND demon mobs) ──
function Sheet({profile,isOwn,badge,onStat,onDeck,onAdd,onEdit,onDel,onCycle,onAtk,onBug,onRename,onHp,onHpDamage,onBufferUsed,onPing,onRollProg}){
  const [tab,setTab]=useState('deck');
  const progs=(profile.programs||[]).filter(p=>p&&(p.category==='attacking'||p.category==='defensive'||p.category==='support'));
  const bugs=profile.bugs||defBugs();
  const bufferMu=pn(profile.cyberdeck?.defense)/2;
  const usedMu=progs.reduce((s,p)=>{const n=+p.mu;return s+(isNaN(n)?0:n);},0)+bufferMu;
  const totMu=+profile.cyberdeck?.memory||0;
  const ovf=totMu>0&&usedMu>totMu;
  const gCrit=globalCrit(progs),gFum=globalFumble(progs,bugs);
  const effStats=effectiveStats(profile);
  const defVal=defenseValue(effStats,progs,bugs);
  const defBonus=defenseBonus(progs,bugs);
  const spd=calcSpeed(effStats,progs,bugs);
  const atkP=progs.filter(p=>p.category==='attacking');
  const defP=progs.filter(p=>p.category==='defensive');
  const utlP=progs.filter(p=>p.category==='support');
  const abCnt=BUGS.filter(b=>(bugs[b.id]||0)>0).length;
  const tabs=[{id:'deck',lb:'КИБЕРДЕКА'},{id:'progs',lb:`ПРОГРАММЫ(${progs.length})`},{id:'bugs',lb:`БАГИ${abCnt?' ['+abCnt+']':''}`}];
  return<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
    <div style={{background:C.pan,borderBottom:'1px solid '+C.brd,padding:'10px 18px',display:'flex',alignItems:'center',gap:12,flexShrink:0,flexWrap:'wrap'}}>
      <div style={{width:13,height:13,borderRadius:'50%',background:profile.color,boxShadow:'0 0 12px '+profile.color,flexShrink:0}}/>
      {onRename?<RenameField value={profile.handle} onChange={onRename} color={profile.color}/>
        :<span style={{fontFamily:C.or,fontSize:19,color:profile.color,letterSpacing:2}}>{profile.handle}</span>}
      {badge&&<span style={{fontSize:12,color:TX2,border:'1px solid '+C.brd,padding:'2px 10px',marginLeft:4}}>{badge}</span>}
      {profile.isGM&&<span style={{fontSize:12,color:C.rdl,border:'1px solid '+C.rdl+'55',padding:'2px 8px'}}>GM</span>}
      {profile.mobType==='demon'&&<span style={{fontSize:12,color:C.prp,border:'1px solid '+C.prp+'55',padding:'2px 8px'}}>ДЕМОН</span>}
    </div>
    <div style={{background:C.pan,borderBottom:'1px solid '+C.brd,padding:'12px 18px 14px',flexShrink:0}}>
      <HealthTrack dmg={profile.hpDamage} onChange={onHpDamage} isOwn={isOwn}/>
      <BufferTrack used={profile.bufferUsed} capacity={pn(profile.cyberdeck?.defense)} onChange={onBufferUsed} isOwn={isOwn}/>
    </div>
    <div style={{display:'flex',borderBottom:'1px solid '+C.brd,background:C.pan,flexShrink:0}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{background:'transparent',border:'none',borderBottom:tab===t.id?'2px solid '+C.aml:'2px solid transparent',color:tab===t.id?C.aml:TX2,fontFamily:C.fn,fontSize:13,letterSpacing:2,padding:'11px 20px',cursor:'pointer'}}>{t.lb}</button>)}
    </div>
    <div style={{flex:1,overflowY:'auto',padding:18}}>
      {tab==='deck'&&<DeckTab p={profile} isOwn={isOwn} onStat={onStat} onDeck={onDeck} gCrit={gCrit} gFum={gFum} defVal={defVal} defBonus={defBonus} spd={spd} usedMu={usedMu} totMu={totMu} ovf={ovf} effInt={effStats.int} bufferMu={bufferMu}/>}
      {tab==='progs'&&<ProgsTab atkP={atkP} defP={defP} utlP={utlP} isOwn={isOwn} onAdd={onAdd} onEdit={onEdit} onDel={onDel} onCycle={onCycle} onAtk={onAtk} onPing={onPing} onRollProg={onRollProg}/>}
      {tab==='bugs'&&<BugsTab bugs={bugs} isOwn={isOwn} onBug={onBug}/>}
    </div>
  </div>;
}

// ── Deck Tab ───────────────────────────────────────────
function DeckTab({p,isOwn,onStat,onDeck,gCrit,gFum,defVal,defBonus,spd,usedMu,totMu,ovf,effInt,bufferMu}){
  const baseInt=pn(p.stats?.int);
  const woundedInt=effInt!==undefined&&effInt!==baseInt;
  return<div style={{display:'flex',flexDirection:'column',gap:16}}>
    <Box color={C.aml} label="// ПЕРСОНАЖ">
      <G2>
        <SF label={`Интеллект (INT)${woundedInt?` — эфф. ${effInt}`:''}`} v={p.stats?.int} onChange={v=>onStat('int',v)} dis={!isOwn} hint="0 / 1d6+4"/>
        <SF label="Интерфейс (IFACE)" v={p.stats?.iface} onChange={v=>onStat('iface',v)} dis={!isOwn} hint="0 / 1d10"/>
      </G2>
      <div style={{borderTop:'1px solid '+C.brd,paddingTop:14,marginTop:8}}>
        <Lbl t="AUTO-РАСЧЁТ (по активным программам, багам и ранениям)"/>
        <G4>
          <AS label="Скорость деки" val={spd} c={C.cyl} sub="эфф.INT + spd-бонусы − баги"/>
          <AS label="Защита" val={defVal} c={C.gnl} sub={`эфф.INT+IFACE+бонус DV(${defBonus>=0?'+':''}${defBonus})`}/>
          <AS label="Порог Крита ≥" val={gCrit} c={C.aml} sub="10 + моды защ/всп (мин. 6)"/>
          <AS label="Порог Провала ≤" val={gFum} c={C.rdl} sub="1 + моды защ/всп + баги (макс. 5)"/>
        </G4>
      </div>
    </Box>
    <Box color={C.aml} label="// КИБЕРДЕКА">
      <G2>
        <SF label="Модель" v={p.cyberdeck?.name} onChange={v=>onDeck('name',v)} dis={!isOwn} hint="Militech Delphi..."/>
        <SF label="Память (MU)" v={p.cyberdeck?.memory} onChange={v=>onDeck('memory',v)} dis={!isOwn} hint="20"/>
        <SF label="Скорость (raw)" v={p.cyberdeck?.speed_raw} onChange={v=>onDeck('speed_raw',v)} dis={!isOwn} hint="3"/>
        <SF label="Буфер" v={p.cyberdeck?.defense} onChange={v=>onDeck('defense',v)} dis={!isOwn} hint="0"/>
      </G2>
      {totMu>0&&<div style={{marginTop:10}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6,color:ovf?C.rdl:TX2}}>
          <span>ЗАГРУЗКА ПАМЯТИ</span>
          <span style={{color:ovf?C.rdl:C.aml,fontWeight:'bold'}}>{usedMu}/{totMu} MU {ovf&&'⚠ ПЕРЕПОЛНЕНИЕ'}</span>
        </div>
        {bufferMu>0&&<div style={{fontSize:11,color:TX2,marginBottom:6}}>из них Буфер: {bufferMu} MU (2 Буфера = 1 MU)</div>}
        <div style={{height:5,background:C.brd,borderRadius:2}}>
          <div style={{height:'100%',width:Math.min(100,usedMu/totMu*100)+'%',background:ovf?C.rdl:C.aml,transition:'width 0.4s',borderRadius:2,boxShadow:'0 0 6px '+(ovf?C.rdl:C.aml)+'88'}}/>
        </div>
      </div>}
    </Box>
  </div>;
}

// ── Progs Tab ──────────────────────────────────────────
function ProgsTab({atkP,defP,utlP,isOwn,onAdd,onEdit,onDel,onCycle,onAtk,onPing,onRollProg}){
  const total=atkP.length+defP.length+utlP.length;
  const [open,setOpen]=useState({attacking:true,defensive:true,support:true});
  const toggle=k=>setOpen(o=>({...o,[k]:!o[k]}));
  return<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <span style={{fontSize:13,color:TX2}}>Установлено: {total}</span>
      {isOwn&&<button onClick={onAdd} style={{...SB(C.cyl,C.cyl,{fontSize:13,padding:'7px 18px',letterSpacing:2})}}>+ УСТАНОВИТЬ (своя программа)</button>}
    </div>
    {atkP.length>0&&<><SH c={C.rdl} l={`АТАКУЮЩИЕ (${atkP.length})`} mt={false} open={open.attacking} onClick={()=>toggle('attacking')}/>
      {open.attacking&&atkP.map(p=><PC key={p.id} prog={p} isOwn={isOwn} onEdit={onEdit} onDel={onDel} onCycle={onCycle} onAtk={onAtk} onPing={onPing}/>)}</>}
    {defP.length>0&&<><SH c={C.cyl} l={`ЗАЩИТНЫЕ (${defP.length})`} mt={atkP.length>0} open={open.defensive} onClick={()=>toggle('defensive')}/>
      {open.defensive&&defP.map(p=><PC key={p.id} prog={p} isOwn={isOwn} onEdit={onEdit} onDel={onDel} onCycle={onCycle} onAtk={null} onPing={onPing}/>)}</>}
    {utlP.length>0&&<><SH c={C.aml} l={`ВСПОМОГАТЕЛЬНЫЕ (${utlP.length})`} mt={atkP.length>0||defP.length>0} open={open.support} onClick={()=>toggle('support')}/>
      {open.support&&utlP.map(p=><PC key={p.id} prog={p} isOwn={isOwn} onEdit={onEdit} onDel={onDel} onCycle={onCycle} onAtk={null} onPing={onPing} onRollProg={onRollProg}/>)}</>}
    {total===0&&<div style={{fontSize:14,color:TX2,padding:'24px 0'}}>// Кибердека пуста</div>}
  </div>;
}
function SH({c,l,mt,open,onClick}){
  return<div onClick={onClick} style={{fontSize:13,color:c,letterSpacing:3,marginBottom:9,marginTop:mt?16:2,cursor:'pointer',userSelect:'none',display:'flex',alignItems:'center',gap:7}}>
    <span style={{fontSize:11}}>{open?'▾':'▸'}</span><span>{l}</span>
  </div>;
}

// ── Program Card ───────────────────────────────────────
function PC({prog,isOwn,onEdit,onDel,onCycle,onAtk,onPing,onRollProg}){
  const cc=CATC[prog.category];
  const st=prog.status||'active';
  const sc=SCOL[st],isAct=st==='active',isAtk=prog.category==='attacking';
  const hasAtkStats=isAtk&&(prog.hit_bonus||prog.dmg_runners||prog.dmg_programs);
  const hasDefUtil=(prog.category==='defensive'||prog.category==='support')&&(prog.dv||prog.spd_bonus||prog.hit_bonus||prog.dmg_bonus_runners||prog.dmg_bonus_programs);
  const hasCM=prog.crit_mod||prog.fumble_mod;
  const hasGeneric=prog.cooldown||prog.duration||prog.activations||prog.detectDifficulty||prog.roll_dice;
  return<div style={{background:C.pan2,border:'1px solid '+(isAct?cc+'55':C.brd),marginBottom:8,opacity:isAct?1:0.48,transition:'all 0.15s'}}>
    <div style={{display:'flex'}}>
      <div style={{width:4,background:isAct?cc:sc,flexShrink:0}}/>
      <div style={{flex:1,padding:'10px 13px'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:6,flexWrap:'wrap'}}>
          <span style={{fontSize:15,color:isAct?C.txb:TX2,fontWeight:'bold',flex:1}}>{prog.name||'Без названия'}</span>
          <span style={{fontSize:10,color:cc,border:'1px solid '+cc+'44',padding:'2px 8px',flexShrink:0}}>{CATL[prog.category]}</span>
          {prog.mu&&<span style={{fontSize:12,color:TX2}}>MU:{prog.mu}</span>}
          {prog.price&&<span style={{fontSize:12,color:TX2}}>eb:{prog.price}</span>}
        </div>
        {hasAtkStats&&<Row>{prog.hit_bonus&&<KV l="ПОП" v={prog.hit_bonus} c={C.aml}/>}{prog.dmg_runners&&<KV l="УРН.РАН" v={prog.dmg_runners} c={C.rdl}/>}{prog.dmg_programs&&<KV l="УРН.ПРГ" v={prog.dmg_programs} c={C.org}/>}</Row>}
        {hasDefUtil&&<Row>{prog.dv&&<KV l="ЗАЩ+" v={prog.dv} c={C.gnl}/>}{prog.spd_bonus&&<KV l="СКР+" v={prog.spd_bonus} c={C.cyl}/>}{prog.hit_bonus&&<KV l="ПОП+" v={prog.hit_bonus} c={C.aml}/>}{prog.dmg_bonus_runners&&<KV l="УРН.РАН+" v={prog.dmg_bonus_runners} c={C.rdl}/>}{prog.dmg_bonus_programs&&<KV l="УРН.ПРГ+" v={prog.dmg_bonus_programs} c={C.org}/>}</Row>}
        {hasCM&&<Row>{prog.crit_mod&&<KV l="КРИТ МОД" v={(+prog.crit_mod>0?'+':'')+prog.crit_mod} c={C.aml}/>}{prog.fumble_mod&&<KV l="ПРОВАЛ МОД" v={(+prog.fumble_mod>0?'+':'')+prog.fumble_mod} c={C.rdl}/>}</Row>}
        {hasGeneric&&<Row>{prog.detectDifficulty&&<KV l="ОБНАРУЖ" v={prog.detectDifficulty} c={C.cyl}/>}{prog.duration&&<KV l="ДЛИТ" v={prog.duration} c={TX2}/>}{prog.activations&&<KV l="АКТИВ" v={prog.activations} c={TX2}/>}{prog.cooldown&&<KV l="ПЕРЕЗАРЯД" v={prog.cooldown} c={TX2}/>}{prog.roll_dice&&<KV l="БРОСОК" v={prog.roll_dice} c={C.aml}/>}</Row>}
        {prog.description&&<div style={{fontSize:12,color:TX2,borderTop:'1px solid '+C.brd+'88',paddingTop:6,marginTop:6,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{prog.description}</div>}
        {isOwn?<div style={{display:'flex',gap:7,marginTop:10,flexWrap:'wrap',alignItems:'center'}}>
          {isAtk&&onAtk&&isAct&&<button onClick={()=>onAtk(prog)} style={{...SB(cc,cc,{fontSize:13,padding:'5px 16px',letterSpacing:2})}}>⚔ АТАКА</button>}
          {prog.category==='support'&&prog.roll_dice&&onRollProg&&isAct&&<button onClick={()=>onRollProg(prog)} style={{...SB(C.aml,C.aml,{fontSize:13,padding:'5px 16px',letterSpacing:2})}}>🎲 БРОСОК</button>}
          <button onClick={()=>onCycle(prog.id)} style={{...SB(sc,sc,{fontSize:12,padding:'5px 14px'})}}>{SLBL[st]}</button>
          {onPing&&<button onClick={()=>onPing(prog)} title="Показать всем в журнале" style={SB(C.gnl+'88',C.gnl,{fontSize:13,padding:'5px 11px'})}>📡</button>}
          <button onClick={()=>onEdit(prog)} style={SB(C.brdl,C.tx,{fontSize:13,padding:'5px 11px'})}>✎</button>
          <button onClick={()=>onDel(prog.id)} style={SB(C.rdl+'55',C.rdl,{fontSize:13,padding:'5px 11px'})}>✕</button>
        </div>:<div style={{marginTop:6,fontSize:13,color:sc}}>{SLBL[st]}</div>}
      </div>
    </div>
  </div>;
}
function Row({children}){return<div style={{display:'flex',gap:16,marginBottom:6,flexWrap:'wrap'}}>{children}</div>;}
function KV({l,v,c}){return<div style={{display:'flex',alignItems:'baseline',gap:5}}><span style={{fontSize:11,color:TX2,letterSpacing:1}}>{l}:</span><span style={{fontSize:14,color:c||C.txb,fontFamily:C.fn}}>{v}</span></div>;}

// ── Bugs Tab ───────────────────────────────────────────
function BugsTab({bugs,isOwn,onBug}){
  return<div>
    <div style={{fontSize:11,color:C.rdl,letterSpacing:2,marginBottom:7}}>// СИСТЕМНЫЕ БАГИ</div>
    {BUGS.map(bug=>{
      const cnt=bugs[bug.id]||0,act=cnt>0;
      return<div key={bug.id} style={{background:act?'rgba(238,68,85,0.1)':C.pan2,border:'1px solid '+(act?C.rdl+'66':C.brd),padding:'4px 9px',marginBottom:3,display:'flex',alignItems:'center',gap:8,transition:'all 0.2s'}}>
        <div style={{fontSize:11,color:act?C.rdl:TX2,minWidth:18,fontWeight:'bold',flexShrink:0}}>#{bug.id}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'baseline',gap:7,flexWrap:'wrap'}}>
            <span style={{fontSize:13,color:act?C.rdll:C.txb,fontWeight:act?'bold':'normal'}}>{bug.label}</span>
            <span style={{fontSize:11,color:act?C.rdl+'cc':TX2,whiteSpace:'normal'}}>{bug.desc}</span>
            {bug.numeric&&act&&cnt>0&&<span style={{fontSize:11,color:C.rdl}}>({bug.mult*cnt>0?'+':''}{bug.mult*cnt})</span>}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
          {isOwn?<>
            <button onClick={()=>onBug(bug.id,cnt-1)} style={{...SB(C.brd,C.txb,{padding:'0px 8px',fontSize:14,lineHeight:1.6})}}>−</button>
            <span style={{fontFamily:C.or,fontSize:15,color:act?C.rdl:TX2,minWidth:18,textAlign:'center'}}>{cnt||'—'}</span>
            <button onClick={()=>onBug(bug.id,cnt+1)} style={{...SB(act?C.rdl:C.brd,act?C.rdl:C.txb,{padding:'0px 8px',fontSize:14,lineHeight:1.6})}}>+</button>
          </>:<span style={{fontFamily:C.or,fontSize:15,color:act?C.rdl:TX2,minWidth:18,textAlign:'center'}}>{cnt||'—'}</span>}
        </div>
      </div>;
    })}
  </div>;
}

// ── Shared layout ───────────────────────────────────────
function Box({color,label,children}){return<div style={{background:C.pan,border:'1px solid '+C.brd}}><div style={{padding:'9px 16px',borderBottom:'1px solid '+C.brd,background:C.pan2}}><span style={{fontSize:12,color:color||C.aml,letterSpacing:3}}>{label}</span></div><div style={{padding:'14px 16px'}}>{children}</div></div>;}
function G2({children}){return<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:'0 22px'}}>{children}</div>;}
function G4({children}){return<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(148px,1fr))',gap:'4px 18px'}}>{children}</div>;}
function AS({label,val,c,sub}){return<div style={{marginBottom:12}}><div style={{fontSize:11,color:TX2,letterSpacing:2,marginBottom:5,textTransform:'uppercase'}}>{label}</div><div style={{fontSize:25,color:c||C.txb,fontFamily:C.fn}}>{val}</div>{sub&&<div style={{fontSize:11,color:TX2,marginTop:2}}>{sub}</div>}</div>;}
function SF({label,v,onChange,dis,hint}){
  const [ed,setEd]=useState(false);
  const [val,setVal]=useState(v||'');
  useEffect(()=>setVal(v||''),[v]);
  const commit=()=>{onChange&&onChange(val);setEd(false);};
  return<div style={{marginBottom:12}}><div style={{fontSize:13,color:TX2,letterSpacing:2,marginBottom:7,textTransform:'uppercase'}}>{label}</div>
    {!dis&&ed?<input autoFocus value={val} onChange={e=>setVal(e.target.value)} onBlur={commit}
        onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){setVal(v||'');setEd(false);}}}
        placeholder={hint||'0 / 1d6+2'} style={SI({fontSize:15})}/>
      :<div onClick={()=>!dis&&setEd(true)} style={{cursor:dis?'default':'pointer',display:'flex',alignItems:'center',gap:9}}>
          <span style={{fontSize:15,color:val?C.txb:'#4a5e70',borderBottom:dis?'none':'1px dotted '+C.brdl,padding:'2px 2px'}}>{val||<span style={{fontSize:12,color:'#4a5e70'}}>—</span>}</span>
          {!dis&&<span style={{fontSize:11,color:C.brdl}}>✎</span>}
        </div>}
  </div>;
}


// ── Program Modal (create/edit a program directly on a sheet) ──
function ProgModal({ini,onSave,onClose,lockCategory}){
  const def={name:'',category:lockCategory||'attacking',status:'active',price:'',mu:'',
    hit_bonus:'',dmg_runners:'',dmg_programs:'',crit_mod:'',fumble_mod:'',description:'',dv:'',
    detectDifficulty:'',duration:'',activations:'',cooldown:'',has_roll:false,roll_dice:'',
    has_spd:false,has_hit:false,has_dr:false,has_dp:false,spd_bonus:'',dmg_bonus_runners:'',dmg_bonus_programs:''};
  const [p,setP]=useState(()=>ini
    ?{...def,...ini,category:lockCategory||ini.category,has_spd:!!ini.spd_bonus,has_hit:!!(ini.category!=='attacking'&&ini.hit_bonus),has_dr:!!ini.dmg_bonus_runners,has_dp:!!ini.dmg_bonus_programs,has_roll:!!ini.roll_dice}
    :{...def});
  const s=(k,v)=>setP(x=>({...x,[k]:v}));
  const cc=CATC[p.category];
  const isModCategory=p.category==='defensive'||p.category==='support';
  const hp='число или dice: 1d6, 1d10+3';
  const save=()=>{
    if(!p.name.trim())return;
    const o={...p};
    if(o.category!=='defensive'&&o.category!=='support'){
      if(!o.has_spd)o.spd_bonus='';
    } else {
      // def/support: hit_bonus is a checkbox-gated deck-wide bonus
      if(!o.has_hit)o.hit_bonus='';
      if(!o.has_spd)o.spd_bonus='';
    }
    if(o.category!=='attacking'){o.dmg_runners='';o.dmg_programs='';}
    if(!o.has_dr)o.dmg_bonus_runners='';
    if(!o.has_dp)o.dmg_bonus_programs='';
    if(o.category!=='support'||!o.has_roll)o.roll_dice='';
    delete o.has_spd;delete o.has_hit;delete o.has_dr;delete o.has_dp;delete o.has_roll;
    onSave(o);
  };
  return<div style={{background:C.pan,border:'1px solid '+cc+'66',width:600,maxWidth:'97%',maxHeight:'92vh',overflowY:'auto',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'13px 20px',borderBottom:'1px solid '+C.brd,display:'flex',alignItems:'center',justifyContent:'space-between',background:C.pan2,flexShrink:0}}>
      <span style={{fontFamily:C.or,fontSize:13,color:cc,letterSpacing:2}}>{!ini?.id?'// УСТАНОВИТЬ ПРОГРАММУ':'// РЕДАКТИРОВАТЬ ПРОГРАММУ'}</span>
      <button onClick={onClose} style={{background:'transparent',border:'none',color:TX2,cursor:'pointer',fontSize:24,lineHeight:1}}>✕</button>
    </div>
    <div style={{padding:22,display:'flex',flexDirection:'column',gap:16}}>
      <FL label="Название программы"><input value={p.name} onChange={e=>s('name',e.target.value)} placeholder="Собственная программа..." style={SI({fontSize:16})}/></FL>
      {!lockCategory&&<FL label="Категория"><div style={{display:'flex',gap:10}}>
        {Object.entries(CATL).map(([k,v])=><button key={k} onClick={()=>s('category',k)} style={{...SB(p.category===k?CATC[k]:C.brd,p.category===k?CATC[k]:TX2,{flex:1,padding:'9px 4px',fontSize:13,letterSpacing:1})}}>{v}</button>)}
      </div></FL>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <FL label="Цена (eb)"><input value={p.price} onChange={e=>s('price',e.target.value)} placeholder={hp} style={SI()}/></FL>
        <FL label="Память (MU)"><input value={p.mu} onChange={e=>s('mu',e.target.value)} placeholder="2" style={SI()}/></FL>
      </div>

      <div style={{background:C.pan2,border:'1px solid '+C.brdl,padding:14}}>
        <div style={{fontSize:12,color:C.aml,letterSpacing:2,marginBottom:6}}>МОДИФИКАТОРЫ КРИТИЧЕСКИХ ПОРОГОВ</div>
        <div style={{fontSize:12,color:TX2,marginBottom:12}}>{p.category==='attacking'?'⚠ Только для этой программы. Не влияет на общий порог деки.':'Влияют на глобальный порог деки (все атакующие программы).'}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <FL label="Порог Крита (мод)"><input value={p.crit_mod} onChange={e=>s('crit_mod',e.target.value)} placeholder="+1 / -2" style={SI()}/></FL>
          <FL label="Порог Провала (мод)"><input value={p.fumble_mod} onChange={e=>s('fumble_mod',e.target.value)} placeholder="+1 / -1" style={SI()}/></FL>
        </div>
      </div>

      {p.category==='attacking'&&<div style={{background:C.pan2,border:'1px solid '+C.rdl+'33',padding:14}}>
        <div style={{fontSize:12,color:C.rdl,letterSpacing:2,marginBottom:14}}>ХАРАКТЕРИСТИКИ АТАКУЮЩЕЙ ПРОГРАММЫ</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>

// ── Log Panel ────────────────────────────────────────────
const LTCOL={info:C.txb,roll:C.aml,crit:C.amll,critexplode:C.org,fumble:C.rdl,system:C.cyl,ping:C.gnl};

function renderDetail(entry){
  if(!entry.detail)return null;
  let p=null;try{p=JSON.parse(entry.detail);}catch{}
  if(!p)return<div style={{marginTop:5,marginLeft:8,paddingLeft:12,borderLeft:'2px solid '+entry.color+'33',fontSize:13,color:TX2,lineHeight:1.7}}>{entry.detail}</div>;

  // Manual /r chat roll — no explosion, shows every individual die
  if(p.manual){
    return<div style={{marginTop:7,marginLeft:6,paddingLeft:10,borderLeft:'2px solid '+entry.color+'44'}}>
      <div style={{fontSize:10,color:TX2,letterSpacing:2,marginBottom:5}}>{p.dice.length}×d{p.sides}{p.mod?(p.mod>0?' +'+p.mod:' '+p.mod):''}</div>
      <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:7}}>
        {p.dice.map((d,i)=><span key={i} style={{fontFamily:C.or,fontSize:19,color:C.amll,background:C.pan3,border:'1px solid '+C.brdl,padding:'3px 11px',borderRadius:3}}>{d}</span>)}
      </div>
      <div style={{fontSize:13,color:C.txb}}>Сумма: <span style={{fontFamily:C.or,fontSize:24,color:C.amll,textShadow:'0 0 14px '+C.aml+'66'}}>{p.total}</span></div>
    </div>;
  }

  // Program ping — broadcast a program's stats/description to everyone
  if(p.ping&&p.prog){
    const pr=p.prog;
    const cc=CATC[pr.category]||C.txb;
    const badges=[['MU',pr.mu],['ЦЕНА',pr.price],['ПОП',pr.hit_bonus],['УРН.РАН',pr.dmg_runners],['УРН.ПРГ',pr.dmg_programs],
      ['ЗАЩ+',pr.dv],['СКР+',pr.spd_bonus],['КРИТ МОД',pr.crit_mod],['ПРОВАЛ МОД',pr.fumble_mod],
      ['ОБНАРУЖ',pr.detectDifficulty],['ДЛИТ',pr.duration],['АКТИВ',pr.activations],['ПЕРЕЗАРЯД',pr.cooldown]]
      .filter(([,v])=>v&&String(v).trim());
    return<div style={{marginTop:7,marginLeft:6,paddingLeft:10,borderLeft:'2px solid '+cc+'66'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
        <span style={{fontSize:16,color:cc,fontWeight:'bold'}}>{pr.name}</span>
        <span style={{fontSize:10,color:cc,border:'1px solid '+cc+'44',padding:'1px 7px'}}>{CATL[pr.category]}</span>
      </div>
      {badges.length>0&&<div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:6}}>
        {badges.map(([lb,v])=><span key={lb} style={{fontSize:12,color:TX2}}>{lb}: <span style={{color:C.txb}}>{v}</span></span>)}
      </div>}
      {pr.verLabel&&<div style={{fontSize:12,color:TX2,marginBottom:5}}>Версия: <span style={{color:C.txb,fontFamily:C.or}}>{pr.verLabel}</span></div>}
      {(pr.notes||(!pr.verLabel&&pr.description))&&<div style={{fontSize:13,color:C.tx,lineHeight:1.65,whiteSpace:'pre-wrap'}}>{pr.notes||pr.description}</div>}
    </div>;
  }

  // Attack result
  if(entry.action.startsWith('⚔ АТАКА')){
    const isCrit=p.isCrit,isFum=p.isFum,isExplode=!!p.isCritExplode;
    const critCol=isExplode?C.org:C.amll;
    return<div style={{marginTop:7,marginLeft:6,paddingLeft:10,borderLeft:'2px solid '+entry.color+'44'}}>
      <div style={{display:'flex',flexWrap:'wrap',gap:14,marginBottom:6}}>
        <div>
          <div style={{fontSize:10,color:TX2,letterSpacing:2,marginBottom:3}}>ПОПАДАНИЕ</div>
          <span style={{fontFamily:C.or,fontSize:32,color:isCrit?critCol:isFum?C.rdll:C.cyll,textShadow:'0 0 16px '+(isCrit?(isExplode?C.org:C.aml):isFum?C.rdl:C.cyl)+'77',lineHeight:1}}>{p.hitTotal}</span>
          {isCrit&&(isExplode
            ?<div style={{fontSize:12,color:C.org,fontWeight:'bold',marginTop:2}}>💥 КРИТ.УСПЕХ (ВЗРЫВ)</div>
            :<div style={{fontSize:12,color:C.amll,fontWeight:'bold',marginTop:2}}>🔴 КРИТ.УСПЕХ (мод.)</div>)}
          {isFum&&<div style={{fontSize:12,color:C.rdll,fontWeight:'bold',marginTop:2}}>⚫ ПРОВАЛ!</div>}
        </div>
        {p.dmgR&&<div>
          <div style={{fontSize:10,color:C.rdl,letterSpacing:2,marginBottom:3}}>УРОН/РАН</div>
          <span style={{fontFamily:C.or,fontSize:32,color:C.rdll,textShadow:'0 0 14px '+C.rdl+'66',lineHeight:1}}>{p.dmgR.total}</span>
        </div>}
        {p.dmgP&&<div>
          <div style={{fontSize:10,color:C.org,letterSpacing:2,marginBottom:3}}>УРОН/ПРГ</div>
          <span style={{fontFamily:C.or,fontSize:32,color:C.org,textShadow:'0 0 14px '+C.org+'66',lineHeight:1}}>{p.dmgP.total}</span>
        </div>}
      </div>
      <div style={{fontSize:11,color:TX2,lineHeight:1.6,wordBreak:'break-word'}}>{p.hitExpr}</div>
      {p.dmgR?.parts&&<div style={{fontSize:11,color:TX2,wordBreak:'break-word'}}>Ур/ран: {p.dmgR.parts.join(' ')}</div>}
      {p.dmgP?.parts&&<div style={{fontSize:11,color:TX2,wordBreak:'break-word'}}>Ур/прг: {p.dmgP.parts.join(' ')}</div>}
    </div>;
  }
  // Defense / Init / generic Roll — all share {total, expr}
  const LBL={'🛡 ЗАЩИТА':['ЗАЩИТА',C.gnll,C.gnl],'🎲 ИНИЦИАТИВА':['ИНИЦИАТИВА',C.cyll,C.cyl],'🎲 БРОСОК':['БРОСОК',C.org,C.org]};
  const meta=LBL[entry.action]||(entry.action.startsWith('🎲 ')?['БРОСОК',C.amll,C.aml]:null);
  if(meta&&p.total!==undefined){
    const[lb,fg,glow]=meta;
    return<div style={{marginTop:7,marginLeft:6,paddingLeft:10,borderLeft:'2px solid '+entry.color+'44'}}>
      <div style={{fontSize:10,color:TX2,letterSpacing:2,marginBottom:3}}>{lb}</div>
      <span style={{fontFamily:C.or,fontSize:34,color:fg,textShadow:'0 0 16px '+glow+'66',lineHeight:1}}>{p.total}</span>
      <div style={{fontSize:11,color:TX2,lineHeight:1.6,marginTop:4,wordBreak:'break-word'}}>{p.expr}</div>
    </div>;
  }
  return<div style={{marginTop:5,marginLeft:6,paddingLeft:10,borderLeft:'2px solid '+entry.color+'33',fontSize:13,color:TX2,lineHeight:1.7}}>{entry.detail}</div>;
}

function LogPanel({logs,logRef,onSendMsg}){
  const [width,setWidth]=useState(360);
  const [msg,setMsg]=useState('');
  const atBottomRef=useRef(true);

  useEffect(()=>{
    const el=logRef.current;
    if(!el)return;
    if(atBottomRef.current) el.scrollTop=el.scrollHeight;
  },[logs]);

  const onScroll=e=>{
    const el=e.currentTarget;
    atBottomRef.current=(el.scrollHeight-el.scrollTop-el.clientHeight)<60;
  };

  const onDragStart=e=>{
    e.preventDefault();
    const startX=e.clientX, startW=width;
    const onMove=ev=>{const delta=startX-ev.clientX;setWidth(Math.max(220,Math.min(window.innerWidth-260,startW+delta)));};
    const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  };

  const sendMsg=()=>{
    const txt=msg.trim();
    if(!txt||!onSendMsg)return;
    setMsg('');
    onSendMsg(txt);
  };

  return<div style={{background:C.pan,borderLeft:'1px solid '+C.brd,width,display:'flex',flexDirection:'column',flexShrink:0,position:'relative'}}>
    <div onMouseDown={onDragStart} style={{position:'absolute',top:0,bottom:0,left:0,width:6,cursor:'ew-resize',zIndex:10,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{width:3,height:40,borderRadius:2,background:C.brdl,opacity:0.7}}/>
    </div>
    <div style={{padding:'10px 14px 10px 18px',borderBottom:'1px solid '+C.brd,flexShrink:0}}>
      <div style={{fontSize:12,color:C.aml,letterSpacing:3}}>// ЖУРНАЛ МАТРИЦЫ</div>
      <div style={{fontSize:12,color:TX2,marginTop:2}}>{logs.length}/{MAX_LOG} записей</div>
    </div>
    <div ref={logRef} onScroll={onScroll} style={{flex:1,overflowY:'auto',padding:'10px 12px',minHeight:0}}>
      {logs.length===0&&<div style={{fontSize:13,color:TX2,padding:'10px 0'}}>// ожидание активности...</div>}
      {logs.map(e=><div key={e.id} style={{marginBottom:9,padding:'7px 10px',borderLeft:'3px solid '+(e.type==='fumble'?C.rdl:e.type==='critexplode'?C.org:e.type==='crit'?C.aml:e.type==='system'?C.cyl:e.color+'88'),background:'rgba(255,255,255,0.016)'}}>
        <div style={{display:'flex',flexDirection:'column',gap:2}}>
          <span style={{color:e.color,fontWeight:'bold',fontSize:14,overflowWrap:'break-word'}}>{e.from} <span style={{color:'#6a7e90',fontWeight:'normal',fontSize:11}}>[{e.t}]</span></span>
          <span style={{color:LTCOL[e.type]||C.txb,fontSize:13,overflowWrap:'break-word'}}>{e.action}</span>
        </div>
        {renderDetail(e)}
      </div>)}
    </div>
    {onSendMsg&&<div style={{padding:'8px 10px',borderTop:'1px solid '+C.brd,display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
      <input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMsg()}
        placeholder="Написать... /r 2d10" style={{...SI({fontSize:14,padding:'6px 10px'})}}/>
      <button onClick={sendMsg} style={{...SB(C.aml,C.aml,{fontSize:13,padding:'6px 16px',width:'100%'})}}>▶ ПОСЛАТЬ</button>
    </div>}
  </div>;
}

// ══════════════════════════════════════════════════════
//   LIBRARY PANEL (view/install for all · edit for GM only)
// ══════════════════════════════════════════════════════
function LibraryPanel({onClose,onInstall,isGM}){
  const [cat,setCat]=useState('attacking');
  const [selId,setSelId]=useState(INIT_LIBRARY[0]?.id||null);
  const [mode,setMode]=useState('view');
  const [overrides,setOverrides]=useState({});
  const [editForm,setEditForm]=useState(null);
  const [toast,setToast]=useState('');
  const [search,setSearch]=useState('');

  useEffect(()=>{
    DB.get('cp20/library_overrides').then(v=>{ if(v)setOverrides(v); });
  },[]);

  // Effective library = built-ins patched by overrides, plus brand-new custom entries
  const library=(()=>{
    const base=INIT_LIBRARY.map(p=>overrides[p.id]?{...overrides[p.id]}:p);
    const customIds=Object.keys(overrides).filter(id=>!INIT_LIBRARY.find(ip=>ip.id===id));
    return[...base,...customIds.map(id=>overrides[id])];
  })();

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(''),2200);};

  const filtered=library.filter(p=>p.category===cat&&(search===''||p.name.toLowerCase().includes(search.toLowerCase())));
  const sel=library.find(p=>p.id===selId);

  const handleInstall=async(prog,v)=>{
    if(!onInstall){showToast('Установка недоступна для текущей цели');return;}
    const ok=await onInstall(prog,v);
    if(ok===false){showToast('Чёрный Лёд может использовать только атакующие программы');return;}
    showToast(`«${prog.name} v${v.v}» добавлена в лист!`);
  };

  const handleSaveCustom=async(form)=>{
    const next={...overrides,[form.id]:form};
    setOverrides(next);
    await DB.set('cp20/library_overrides',next);
    setSelId(form.id);setCat(form.category);setMode('view');
    showToast('Изменения сохранены — видно всем игрокам');
  };

  const handleDelete=async(id)=>{
    if(INIT_LIBRARY.find(p=>p.id===id)){showToast('Базовые программы нельзя удалить, только редактировать');return;}
    if(!window.confirm('Удалить программу из базы?'))return;
    const next={...overrides};delete next[id];
    setOverrides(next);
    await DB.set('cp20/library_overrides',next);
    const rem=library.filter(p=>p.id!==id&&p.category===cat);
    setSelId(rem[0]?.id||null);setMode('view');
    showToast('Программа удалена');
  };

  return<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.93)',zIndex:200,display:'flex',fontFamily:C.fn}}>
    {toast&&<div style={{position:'absolute',top:18,left:'50%',transform:'translateX(-50%)',background:C.gnl,color:C.bg,padding:'8px 22px',fontSize:14,letterSpacing:1,zIndex:210,borderRadius:2}}>{toast}</div>}
    <div style={{display:'flex',width:'100%',height:'100%',overflow:'hidden'}}>
      <div style={{width:230,background:C.pan,borderRight:'1px solid '+C.brd,display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'12px 14px',borderBottom:'1px solid '+C.brd,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontSize:14,color:C.gnl,letterSpacing:3,fontWeight:'bold'}}>NET_PROGRAMS</div>
            <div style={{fontSize:12,color:TX2,marginTop:2}}>{library.length} программ{!isGM&&' · только просмотр'}</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none',color:TX2,cursor:'pointer',fontSize:22,lineHeight:1}}>✕</button>
        </div>
        <div style={{borderBottom:'1px solid '+C.brd}}>
          {Object.entries(LIBCAT_META).map(([k,m])=>{
            const cnt=library.filter(p=>p.category===k).length;
            const col={attacking:C.rdl,defensive:C.cyl,support:C.aml}[k];
            const active=cat===k;
            return<button key={k} onClick={()=>{setCat(k);setMode('view');}}
              style={{width:'100%',background:active?col+'18':'transparent',border:'none',borderLeft:active?'3px solid '+col:'3px solid transparent',
                color:active?col:TX2,fontFamily:C.fn,fontSize:14,padding:'10px 14px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',textAlign:'left'}}>
              <span>{m.icon} {m.label}</span>
              <span style={{fontSize:12,color:active?col:TX2,background:C.pan2,padding:'1px 7px',borderRadius:2}}>{cnt}</span>
            </button>;
          })}
        </div>
        <div style={{padding:'8px 10px',borderBottom:'1px solid '+C.brd}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск..." style={{...SI({fontSize:14,padding:'5px 9px'}),background:C.pan2}}/>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {filtered.map(p=>{
            const col={attacking:C.rdl,defensive:C.cyl,support:C.aml}[p.category];
            const active=selId===p.id&&mode==='view';
            const isBuiltIn=!!INIT_LIBRARY.find(ip=>ip.id===p.id);
            const isEdited=isBuiltIn&&!!overrides[p.id];
            return<button key={p.id} onClick={()=>{setSelId(p.id);setMode('view');}}
              style={{width:'100%',background:active?col+'18':C.pan,border:'none',borderBottom:'1px solid '+C.brd+'55',borderLeft:active?'3px solid '+col:'3px solid transparent',
                color:active?col:C.txb,fontFamily:C.fn,fontSize:15,padding:'9px 14px',cursor:'pointer',textAlign:'left',transition:'all 0.1s'}}>
              <div style={{fontWeight:active?'bold':'normal'}}>{p.name}{isEdited&&<span style={{color:C.aml,fontSize:11}}> ✎</span>}</div>
              <div style={{fontSize:12,color:TX2,marginTop:2}}>{p.versions.length} версий{!isBuiltIn?' · custom':''}</div>
            </button>;
          })}
        </div>
        {isGM&&<div style={{padding:10,borderTop:'1px solid '+C.brd}}>
          <button onClick={()=>{setMode('create');setEditForm({id:uid(),category:cat,name:'',description:'',versions:[{v:'1.0',mu:'',price:'',diff:''}]});}}
            style={{...SB(C.gnl,C.gnl,{width:'100%',padding:'8px',fontSize:14,letterSpacing:1})}}>
            + НОВАЯ ПРОГРАММА
          </button>
        </div>}
      </div>

      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
        {mode==='view'&&sel&&<LibDetail prog={sel} onInstall={handleInstall}
          isGM={isGM}
          onEdit={()=>{setEditForm(JSON.parse(JSON.stringify(sel)));setMode('edit');}}
          onDelete={()=>handleDelete(sel.id)} isBuiltIn={!!INIT_LIBRARY.find(ip=>ip.id===sel.id)}/>}
        {(mode==='create'||mode==='edit')&&editForm&&<LibForm form={editForm} setForm={setEditForm} onSave={handleSaveCustom} onCancel={()=>setMode('view')}/>}
        {mode==='view'&&!sel&&<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,color:TX2}}>Выберите программу</div>}
      </div>
    </div>
  </div>;
}

        <div style={{flex:1}}>
          <div style={{fontSize:12,color:col,letterSpacing:3,marginBottom:6}}>{LIBCAT_META[cat].icon} {LIBCAT_META[cat].label.toUpperCase()}</div>

          {prog.description&&<div style={{fontSize:15,color:C.tx,marginTop:8,lineHeight:1.75,fontStyle:'italic',borderLeft:'2px solid '+C.brdl,paddingLeft:14,maxWidth:520}}>{prog.description}</div>}
        </div>
        {isGM&&<div style={{display:'flex',gap:7,flexShrink:0}}>
          <button onClick={onEdit} style={SB(C.brdl,C.tx,{fontSize:13,padding:'5px 14px'})}>✎ РЕДАКТ.</button>

    </div>
    <div style={{flex:1,overflowX:'auto',padding:'18px 24px'}}>
      <table style={{width:'auto',borderCollapse:'collapse',fontSize:15,background:C.pan2}}>
        <thead>
          <tr>
            {cols.map(c=><th key={c.k} style={{textAlign:'left',padding:'9px 16px',borderBottom:'2px solid '+col,color:col,fontSize:12,letterSpacing:1,whiteSpace:'nowrap',background:C.pan3,position:'sticky',top:0}}>{c.lb}</th>)}
            {hasNotes&&<th style={{textAlign:'left',padding:'9px 16px',borderBottom:'2px solid '+col,color:col,fontSize:12,letterSpacing:1,background:C.pan3,position:'sticky',top:0}}>ОСОБЕННОСТИ / ЭФФЕКТ</th>}
            <th style={{padding:'9px 16px',borderBottom:'2px solid '+col,background:C.pan3,position:'sticky',top:0}}></th>

        </thead>
        <tbody>
          {prog.versions.map((v,i)=>(
            <tr key={i} style={{borderBottom:'1px solid '+C.brd}}>
              {cols.map(c=><td key={c.k} style={{padding:'11px 16px',color:c.k==='v'?col:C.txb,fontWeight:c.k==='v'?'bold':'normal',whiteSpace:'nowrap',verticalAlign:'top'}}>
                {c.k==='v'?'v'+v.v:(v[c.k]||'—')}
              </td>)}
              {hasNotes&&<td style={{padding:'11px 16px',color:C.tx,lineHeight:1.75,fontSize:14,minWidth:220,maxWidth:320}}>

              <div style={{fontSize:12,color:TX2,letterSpacing:2,marginBottom:5,textTransform:'uppercase'}}>{ph}</div>

          ))}

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          {extra.map(f=><div key={f}>

            <input value={v[f]||''} onChange={e=>setVer(i,f,e.target.value)} placeholder={LIBFIELD_LABELS[f]} style={SI({fontSize:14})}/>

          <div style={{fontSize:12,color:TX2,letterSpacing:2,marginBottom:5,textTransform:'uppercase'}}>Особенности / описание версии</div>
          <textarea value={v.diff||''} onChange={e=>setVer(i,'diff',e.target.value)} rows={2} placeholder="Особенности этой версии..." style={{...SI(),resize:'vertical',minHeight:50,lineHeight:1.6,fontSize:14}}/>

      <button onClick={onCancel} style={SB(C.brd,TX2,{padding:'11px 20px',fontSize:14})}>ОТМЕНА</button>
    </div>
  </div>;
}
